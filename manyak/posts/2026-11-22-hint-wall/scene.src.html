<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<body><div id="stage">
<canvas id="c" width="1080" height="1920"></canvas>

<div class="row" id="badgeRow"><div class="in"><span id="badge" class="t">만약에 EP05</span></div></div>
<div class="row" id="titleRow"><div class="in t" id="title">만약 <span class="y">힌트</span> 쓸 때마다?</div></div>
<div class="row" id="counterRow"><div class="in" id="counter"><div class="lab t">담장 높이</div><div class="num t">2,048<small>m</small></div><div class="sub t">힌트 10회</div></div></div>
<div class="row" id="popRow"><div class="in t" id="pop"></div></div>

<div class="row" id="endRow"><div class="in" id="end"><div class="card"><div class="neon t">탈출카페</div><br><div class="ep t">만약에 EP05</div><div class="share t">방탈출 가면 힌트부터<br>찾는 친구한테 보내기</div><div class="next t">다음 만약에는 수요일 저녁 7시</div></div></div></div>
<div id="flash"></div>
</div>
<script src="../../engine/engine.js"></script>
<script>
'use strict';
const { M4, rng, clamp, lerp, smooth, easeOutBack, springCamera, drawCharacter, basis, fitText } = ME;
const E = MiniEngine(document.getElementById('c'));
const gl = E.gl;
const m = E.meshes, D = (...a) => E.draw(...a);
const DURATION = 19.5;
const FONT = "'Noto Sans CJK KR','Noto Sans KR',sans-serif";
const $ = (id) => document.getElementById(id);
const v3 = { add: (a, b) => a.map((x, k) => x + b[k]), sub: (a, b) => a.map((x, k) => x - b[k]), mul: (a, s) => a.map((x) => x * s), len: (a) => Math.hypot(a[0], a[1], a[2]), lerp: (a, b, u) => a.map((x, k) => x + (b[k] - x) * u), norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return a.map(x => x / l); }, dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2] };
const easeOut = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);

// ---------------- timeline ----------------
// 결과(담장 2배) 시각: 힌트 1~20회. 눌림은 결과 0.12초 전.
const RES = [2.08, 2.62, 3.07, 3.52, 4.07, 4.57, 5.07, 5.57, 6.2, 6.6, 8.0, 8.3, 8.6, 8.9, 9.2, 9.62, 9.92, 10.22, 10.52, 11.1];
const T_REV = 13.4, T_MON = 15.2, ENDT = 18.0;
function countAt(t) {
  if (t < 0.8) return 10;
  if (t < 1.1) return Math.max(0, Math.round(10 * (1 - (t - 0.8) / 0.27)));
  let c = 0; for (const r of RES) if (t >= r) c++; return c;
}
function kfAt(t) { // 연속 담장 단계(반동 포함)
  if (t < 0.8) return 10 + 0.15 * smooth(0, 0.8, t);
  if (t < 1.1) return 10 * (1 - smooth(0.8, 1.08, t));
  let k = 0; for (const r of RES) if (t >= r) k += easeOutBack(clamp((t - r) / 0.24, 0, 1)); return k;
}
const HV = (k) => k <= 4 ? Math.pow(2, k + 1) : 32 * Math.pow(2, 0.11 * (k - 4)); // 화면용 높이(512m≈구름층 40에 닿음)
const CLOUD_Y = 42;
function pressAmt(t) { // 손바닥 꾹 (0..1)
  let p = 0;
  for (let i = 0; i < RES.length; i++) { const s = RES[i] - 0.14; const d = t - s; const vis = (i < 8 || i >= 15) ? 1 : 0.45; if (d >= -0.12 && d < 0.2) p = Math.max(p, vis * (d < 0 ? 1 + d / 0.12 : 1 - d / 0.2)); }
  if (t >= 1.9 && t < 2.06) p = Math.max(p, smooth(1.9, 1.96, t));
  return clamp(p, 0, 1);
}
const meters = (c) => 2 * Math.pow(2, c);

// ---------------- world layout ----------------
const TH = -Math.PI / 4;
const NW = [Math.sin(TH), 0, Math.cos(TH)];   // 담장 앞면 법선(카메라 쪽)
const TW = [Math.cos(TH), 0, -Math.sin(TH)];  // 담장 가로 방향
const F0 = [1.15, 0, -0.35];
const wl = (x, y, z) => [F0[0] + TW[0] * x + NW[0] * z, y, F0[2] + TW[2] * x + NW[2] * z];
const WALLM = basis(F0, [0, 1, 0], NW, 1); // 담장 로컬 행렬
const HP = wl(-0.78, 0, 0.72);              // 주인공 발 위치
const BTN = wl(-0.12, 1.22, 0);             // 버튼 받침 중심(벽면)
const CBTN = wl(-0.1, 1.72, 0);             // 카페 벽 힌트 버튼(화면 오른쪽 크롭 안)
const GUARD = [-0.9, 0, 1.0];
const STAFF = wl(-1.7, 0, 1.2);
const HERO_YAW = -0.3;
const heroYaw = (t) => t < 1.1 ? -0.8 : (t >= 12.0 && t < T_REV ? -0.55 : HERO_YAW);

// ---------------- textures ----------------
function canvasTex(w, h, fn, rep) { return E.texture(fn, w, h, rep); }
const TX = {
  stone: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#8b8f99'; c.fillRect(0, 0, w, h); const R = rng(7); for (let r = 0; r < 8; r++) for (let k = 0; k < 4; k++) { const x = k * 64 + (r % 2) * 32, y = r * 32; c.fillStyle = `rgb(${120 + R() * 30 | 0},${124 + R() * 30 | 0},${134 + R() * 30 | 0})`; c.fillRect(x + 2, y + 2, 60, 28); } }, true),
  ply: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#d9b27c'; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(150,100,50,.35)'; c.lineWidth = 2; for (let i = 0; i < 26; i++) { c.beginPath(); c.moveTo(0, i * 10 + Math.sin(i) * 4); c.bezierCurveTo(80, i * 10 + 6, 170, i * 10 - 6, 256, i * 10 + 2); c.stroke(); } c.fillStyle = 'rgba(120,124,134,.55)'; for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) c.fillRect(k * 64 + (r % 2) * 32 + 3, r * 64 + 6, 56, 52); }, true),
  ground: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#4a505c'; c.fillRect(0, 0, w, h); const R = rng(3); for (let i = 0; i < 400; i++) { c.fillStyle = R() < 0.5 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.06)'; c.fillRect(R() * w, R() * h, 3, 3); } }, true),
  floor: canvasTex(256, 256, (c, w, h) => { for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { c.fillStyle = (x + y) % 2 ? '#2b2440' : '#463a66'; c.fillRect(x * 64, y * 64, 64, 64); } }, true),
  cafe: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#5a3f7a'; c.fillRect(0, 0, w, h); c.fillStyle = '#4e356c'; for (let i = 0; i < 8; i++) c.fillRect(i * 32, 0, 14, h); }, true),
  btn: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#e8283c'; c.fillRect(0, 0, w, h); const g = c.createRadialGradient(100, 90, 10, 128, 128, 128); g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); c.fillStyle = '#fff'; c.font = `900 92px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('힌트', 128, 134); }),
  monOff: canvasTex(256, 128, (c, w, h) => { c.fillStyle = '#15171d'; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(255,255,255,.07)'; c.beginPath(); c.moveTo(30, 0); c.lineTo(90, 0); c.lineTo(40, h); c.lineTo(-20, h); c.fill(); }),
  monOn: canvasTex(256, 128, (c, w, h) => { c.fillStyle = '#120406'; c.fillRect(0, 0, w, h); c.strokeStyle = '#ff3346'; c.lineWidth = 5; c.strokeRect(10, 10, w - 20, h - 20); c.fillStyle = '#ff3346'; c.shadowColor = '#ff3346'; c.shadowBlur = 14; c.font = `900 56px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('탈출 실패', w / 2, h / 2 + 2); }),
  neon: canvasTex(512, 128, (c, w, h) => { c.fillStyle = '#1a1024'; c.fillRect(0, 0, w, h); c.strokeStyle = '#ff5fa2'; c.lineWidth = 7; c.shadowColor = '#ff5fa2'; c.shadowBlur = 18; c.strokeRect(10, 10, w - 20, h - 20); c.fillStyle = '#ffe3f0'; c.font = `900 96px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('탈출카페', w / 2, h / 2 + 4); }),
  backdrop: canvasTex(256, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#27346a'); c.fillStyle = g; c.fillRect(0, 0, w, h); c.fillStyle = '#fff6c8'; c.beginPath(); c.arc(180, 70, 30, 0, 7); c.fill(); const R = rng(9); c.fillStyle = '#fff'; for (let i = 0; i < 40; i++) c.fillRect(R() * w, R() * h * 0.7, 2, 2); }),
  earth: canvasTex(256, 128, (c, w, h) => { c.fillStyle = '#2f7de0'; c.fillRect(0, 0, w, h); c.fillStyle = '#3fae4a'; const R = rng(21); for (let i = 0; i < 14; i++) { c.beginPath(); c.ellipse(R() * w, 20 + R() * 90, 14 + R() * 26, 8 + R() * 16, R() * 3, 0, 7); c.fill(); } c.fillStyle = 'rgba(255,255,255,.75)'; for (let i = 0; i < 10; i++) { c.beginPath(); c.ellipse(R() * w, R() * h, 20 + R() * 20, 4, 0, 0, 7); c.fill(); } }, true),
};
// 하늘(카메라에 붙은 먼 판): night / space
function skyCanvas(kind) {
  return canvasTex(256, 512, (c, w, h) => {
    if (kind === 'night') {
      const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#060a22'); g.addColorStop(0.65, '#1a2456'); g.addColorStop(1, '#3a3f78'); c.fillStyle = g; c.fillRect(0, 0, w, h);
      const R = rng(5); for (let i = 0; i < 90; i++) { c.fillStyle = `rgba(255,255,255,${0.3 + R() * 0.6})`; const s = R() < 0.1 ? 2.5 : 1.5; c.fillRect(R() * w, R() * h * 0.8, s, s); }
      c.fillStyle = '#fff6c8'; c.shadowColor = '#fff6c8'; c.shadowBlur = 20; c.beginPath(); c.arc(60, 90, 20, 0, 7); c.fill();
    } else {
      c.fillStyle = '#02030a'; c.fillRect(0, 0, w, h);
      const R = rng(11); for (let i = 0; i < 220; i++) { c.fillStyle = `rgba(255,255,255,${0.3 + R() * 0.7})`; const s = R() < 0.08 ? 2.6 : 1.3; c.fillRect(R() * w, R() * h, s, s); }
      const g = c.createRadialGradient(190, 120, 5, 190, 120, 90); g.addColorStop(0, 'rgba(140,90,255,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    }
  });
}
const SKY = { night: skyCanvas('night'), space: skyCanvas('space') };
function skyQuad(cam, tex) {
  const f = v3.norm(v3.sub(cam.look, cam.pos)); const Dd = 2000;
  const h = 2 * Dd * Math.tan(cam.fov * Math.PI / 360) * 1.12, w = h * 540 / 960 * 1.12;
  let up = [0, 1, 0]; up = v3.norm(v3.sub(up, v3.mul(f, v3.dot(up, f))));
  const c = v3.add(cam.pos, v3.mul(f, Dd));
  D(m.quad, M4.mul(basis(c, up, v3.mul(f, -1), 1), M4.S(w, h, 1)), [1, 1, 1], { tex, em: 1, spec: 0 });
}

// ---------------- helpers ----------------
function limb(a, b, r, col) { const d = v3.sub(b, a), L = v3.len(d); if (L < 1e-4) return; D(m.cyl, M4.mul(basis(v3.lerp(a, b, 0.5), d, [0.3, 0.2, 1], 1), M4.S(r, L, r)), col, { spec: 0.4 }); }
function sph(p, r, col, o) { D(m.sphere, M4.chain(M4.T(p[0], p[1], p[2]), M4.S(r)), col, o || { spec: 0.35 }); }
function arm2(sh, hand, out, col) {
  const mid = v3.lerp(sh, hand, 0.5), L = v3.len(v3.sub(hand, sh)), seg = 0.29;
  const b = Math.sqrt(Math.max(0, seg * seg - (L / 2) * (L / 2)));
  const el = v3.add(mid, v3.mul(v3.norm(out), b));
  limb(sh, el, 0.14, col); limb(el, hand, 0.14, col); sph(el, 0.07, col);
}
function shadow(p, r, a) { D(m.disc, M4.chain(M4.T(p[0], 0.012, p[2]), M4.RX(-Math.PI / 2), M4.S(r)), [0, 0, 0], { alpha: a === undefined ? 0.3 : a, spec: 0, em: 1 }); }

// ---------------- scene parts ----------------
function inCafe(t) { return t >= T_REV; }
function drawGround(t) {
  if (inCafe(t)) {
    D(m.box, M4.chain(M4.T(0, -0.05, 0), M4.S(40, 0.1, 40)), '#ffffff', { tex: TX.floor, tr: [14, 14], spec: 0.2 });
    // 카페 벽(담장 자리 평면) + 옆벽
    D(m.box, M4.chain(WALLM, M4.T(-1, 1.9, -0.06), M4.S(14, 3.8, 0.1)), '#ffffff', { tex: TX.cafe, tr: [6, 2], spec: 0.05 });
    D(m.box, M4.chain(WALLM, M4.T(-4.6, 1.9, 4), M4.RY(Math.PI / 2), M4.S(9, 3.8, 0.1)), '#ffffff', { tex: TX.cafe, tr: [4, 2], spec: 0.05 });
    // 옆벽에 '밤하늘' 배경 그림(세트 소품)
    D(m.quad, M4.chain(WALLM, M4.T(-4.54, 1.9, 2.6), M4.RY(Math.PI / 2), M4.S(3.2, 2.2, 1)), [1, 1, 1], { tex: TX.backdrop, em: 0.6, spec: 0 });
    // 합판 담장(어른 키 2.0) — 로컬 x 0.25~5
    D(m.box, M4.chain(WALLM, M4.T(1.75, 1.0, 0.12), M4.S(3.0, 2.0, 0.24)), '#ffffff', { tex: TX.ply, tr: [2, 1.2], spec: 0.1 });
    D(m.box, M4.chain(WALLM, M4.T(1.75, 2.02, 0.12), M4.S(3.02, 0.04, 0.26)), '#e8c58f', { spec: 0.1 });
    D(m.box, M4.chain(WALLM, M4.T(0.24, 1.0, 0.12), M4.S(0.04, 2.0, 0.26)), '#e8c58f', { spec: 0.1 });
    // 벽 모니터
    const mon = M4.chain(WALLM, M4.T(-1.3, 2.38, 0.06));
    D(m.box, M4.chain(mon, M4.S(1.32, 0.8, 0.08)), '#0d0e12', { spec: 0.6 });
    D(m.quad, M4.chain(mon, M4.T(0, 0, 0.045), M4.S(1.22, 0.69, 1)), [1, 1, 1], { tex: t >= T_MON ? TX.monOn : TX.monOff, em: t >= T_MON ? 0.95 : 0.5, spec: 0.4 });
    // 네온 간판
    D(m.quad, M4.chain(WALLM, M4.T(-1.3, 3.3, 0.02), M4.S(1.5, 0.47, 1)), [1, 1, 1], { tex: TX.neon, em: 1, spec: 0 });
    // 천장 조명 띠
    for (let i = 0; i < 6; i++) sph(v3.add(wl(-3.5 + i * 1.4, 3.55, 0.2), [0, 0, 0]), 0.12, '#fff2b0', { em: 1, spec: 0 });
    return;
  }
  D(m.box, M4.chain(M4.T(0, -0.05, 0), M4.S(400, 0.1, 400)), t >= 12.0 ? '#8a8aa0' : '#ffffff', { tex: TX.ground, tr: [80, 80], spec: 0.05 });
  // 탐조등 탑(멀리) + 빛줄기
  const tower = wl(-7, 0, 9);
  D(m.cyl, M4.chain(M4.T(tower[0], 4, tower[2]), M4.S(0.5, 8, 0.5)), '#3d4150', { spec: 0.2 });
  D(m.box, M4.chain(M4.T(tower[0], 8.3, tower[2]), M4.S(1.6, 0.8, 1.6)), '#2d303c', { spec: 0.2 });
  const sw = Math.sin(t * 0.9) * 0.7;
  const lamp = [tower[0], 8.3, tower[2]];
  D(m.cone, M4.chain(M4.T(lamp[0], lamp[1], lamp[2]), M4.RY(0.6 + sw), M4.RX(-1.05), M4.T(0, -7, 0), M4.S(4, 14, 4)), [1, 0.97, 0.75], { alpha: 0.1, em: 1, spec: 0 });
}
function drawWall(t) {
  if (inCafe(t)) return;
  const H = HV(kfAt(t));
  // 돌담: 로컬 x -5.5..5.5, 두께 0.8
  D(m.box, M4.chain(WALLM, M4.T(5.45, H / 2, -0.4), M4.S(13.1, H, 0.8)), '#ffffff', { tex: TX.stone, tr: [6.5, H / 2], spec: 0.08 });
  D(m.box, M4.chain(WALLM, M4.T(5.45, H + 0.06, -0.4), M4.S(13.3, 0.14, 0.95)), '#6e727c', { spec: 0.1 });
  D(m.box, M4.chain(WALLM, M4.T(-1.2, H / 2, -0.4), M4.S(0.5, H, 1.05)), '#ffffff', { tex: TX.stone, tr: [0.25, H / 2], spec: 0.08 });
  // 철조망
  for (let k = 0; k < 2; k++) { const y = H + 0.28 + k * 0.18; D(m.cyl, M4.chain(WALLM, M4.T(5.45, y, -0.4), M4.RZ(Math.PI / 2), M4.S(0.04, 13.1, 0.04)), '#222', { spec: 0.6 }); }
  for (let i = 0; i < 12; i++) D(m.cyl, M4.chain(WALLM, M4.T(-0.9 + i * 1.1, H + 0.22, -0.4), M4.S(0.05, 0.4, 0.05)), '#2a2a2a', { spec: 0.5 });
  // 쿵: 벽 밑 먼지
  for (const r of RES) { const d = t - r; if (d >= 0 && d < 0.5 && r < 6) { for (let i = 0; i < 5; i++) { const p = wl(-1.6 + i * 0.9, 0.1 + d * 0.4, 0.15 + d * 0.5); D(m.sphere, M4.chain(M4.T(p[0], p[1], p[2]), M4.S(0.25 + d * 0.8)), [0.85, 0.85, 0.9], { alpha: 0.5 * (1 - d / 0.5), em: 0.4 }); } } }
}
function drawButton(t, P) {
  const press = pressAmt(t);
  const B = M4.mul(basis(P, [0, 1, 0], NW, 1), M4.I());
  D(m.box, M4.chain(B, M4.T(0, 0, 0.06), M4.S(0.68, 0.68, 0.12)), '#5a5e68', { spec: 0.6 });
  D(m.box, M4.chain(B, M4.T(0, 0, 0.125), M4.S(0.6, 0.6, 0.012)), '#ffd23f', { spec: 0.3 });
  const push = 0.07 * press;
  D(m.cyl, M4.chain(B, M4.T(0, 0, 0.17 - push / 2), M4.RX(Math.PI / 2), M4.S(0.46, 0.09 - push, 0.46)), '#c81e30', { spec: 0.8 });
  D(m.disc, M4.chain(B, M4.T(0, 0, 0.217 - push), M4.S(0.46)), [1, 1, 1], { tex: TX.btn, spec: 0.8, em: 0.25 });
}
function btnFace(P, t) { return v3.add(P, v3.mul(NW, 0.24 - 0.07 * pressAmt(t))); }
function drawClouds(t) {
  if (inCafe(t) || t < 5.5 || t >= 6.8) return;
  const R = rng(17);
  for (let i = 0; i < 70; i++) {
    const a = R() * Math.PI * 2, d = 5 + R() * 50, y = CLOUD_Y + (R() - 0.5) * 4;
    const c = wl(Math.cos(a) * d, y, Math.sin(a) * d - 0.4);
    const s = 4 + R() * 6;
    D(m.sphere, M4.chain(M4.T(c[0], c[1], c[2]), M4.S(s * 1.6, s * 0.6, s)), [0.92, 0.93, 1.0], { alpha: 0.88, em: 0.35, spec: 0 });
  }

function drawLowClouds(t) { // 콜드 오픈: 담장이 구름을 뚫은 모습(화면용 낮은 구름 띠)

  // 2.4~4.82 '한 번 누르니 담장이 두 배!'는 팝1(2.2~3.4)과 같은 말이라 자막 생략
  [11.1, 12.96, '스무 번 누르니 우주야.'],
  // 13.6~16.19 '알고 보니 방탈출 카페였어.'는 팝2(13.5~15.1)와 같은 말이라 자막 생략
  [16.8, 18.0, '힌트 먼저 찾는 친구 알지?'],
];
const POPS = [
  [2.2, 3.4, '힌트 1번 = 담장 2배!', 30, '#ffe14d'],
  [13.5, 15.1, '알고 보니 방탈출 카페!', 30, '#ffe14d'],
];
let popKey = '';
function hud(t) {
  const s = SUBS.find(([a, b]) => t >= a && t < b);
  $('sub').innerHTML = s ? s[2] : '';
  $('subRow').style.opacity = s && t < ENDT ? 1 : 0;
  const C = $('counter'), c = countAt(t);
  const hf = smooth(13.3, 13.4, t); // 반전 0.1초 전부터 제목·배지·카운터 페이드아웃(카페 간판과 겹침 방지)
  const showC = t < T_REV;
  $('counterRow').style.opacity = (1 - hf).toFixed(3);
  if (showC) {
    C.querySelector('.num').innerHTML = meters(c).toLocaleString('en-US') + '<small>m</small>';
    fitText(C.querySelector('.num'), 48, 300, 30);
    C.querySelector('.sub').textContent = `힌트 ${c}회`;
    let lc = -9; for (let tt = t; tt > t - 0.3; tt -= 1 / 60) { if (countAt(tt) !== c) { lc = tt; break; } }
    let sc = 1 + 0.16 * Math.exp(-(t - lc) * 12);
    if (t >= 11.1 && t < 11.7) sc = 1 + 0.25 * Math.exp(-(t - 11.1) * 7);
    C.style.transform = `scale(${sc.toFixed(3)})`;
  }
  const P = $('pop'), p = POPS.find(([a, b]) => t >= a && t < b);
  if (p && t < ENDT) {
    const u = (t - p[0]) / (p[1] - p[0]); const sc = easeOutBack(Math.min(1, u * 5));
    const key = p[2] + p[3];
    if (key !== popKey) { P.textContent = p[2]; fitText(P, p[3], 330, 22); popKey = key; }
    P.style.color = p[4] || '#fff';
    P.style.transform = `scale(${Math.max(0.01, sc).toFixed(3)})`;
    $('popRow').style.opacity = u > 0.88 ? (1 - (u - 0.88) / 0.12).toFixed(3) : 1;
  } else $('popRow').style.opacity = 0;
  const rw = t >= 0.8 && t < 1.1;
  $('rew').style.opacity = rw ? 0.9 : 0;
  $('c').style.filter = rw ? 'saturate(0.45) contrast(1.15) blur(1px)' : (t >= ENDT ? 'brightness(0.6) blur(2.5px)' : 'none');
  let fl = 0; for (const [ft, a] of [[0.8, 0.45], [1.1, 0.3], [6.2, 0.25], [11.1, 0.35], [12.0, 0.3], [T_REV, 0.45]]) { const d = t - ft; if (d >= 0 && d < 0.3) fl = Math.max(fl, a * (1 - d / 0.3)); }
  $('flash').style.opacity = fl.toFixed(3);
  const ec = smooth(ENDT, ENDT + 0.25, t);
  $('endRow').style.opacity = ec.toFixed(3);
  $('end').style.transform = `scale(${(0.85 + 0.15 * easeOutBack((t - ENDT) / 0.35)).toFixed(3)})`;
  const cf = hf;
  $('titleRow').style.opacity = (1 - cf).toFixed(3);
  $('badgeRow').style.opacity = (1 - cf).toFixed(3);
}

window.DURATION = DURATION;
window.proj = (p) => { const v = window.__vp; const x = v[0] * p[0] + v[4] * p[1] + v[8] * p[2] + v[12], y = v[1] * p[0] + v[5] * p[1] + v[9] * p[2] + v[13], w = v[3] * p[0] + v[7] * p[1] + v[11] * p[2] + v[15]; return [+((x / w * 0.5 + 0.5) * 540).toFixed(0), +((0.5 - y / w * 0.5) * 960).toFixed(0)]; };
window.renderAt = function (t) {
  const cam = window.CAM_OVERRIDE || springCamera(SHOTS, t, shakeAt(t));
  CUR_CAM = cam;
  E.begin(cam, envAt(t));
  scene(t);
  window.__vp = E.end();
  hud(t);
  return true;
};
window.renderAt(0);
</script>
