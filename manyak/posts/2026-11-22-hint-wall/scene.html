<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>만약에 EP05 힌트 담장</title>
<style>
/* 만약에 공통 HUD v2 (EP04~) — 계정 주인 지시 '가운데 정렬' (CSS 540x960 기준)
   모든 글자 블록: 가로 중심 270px, text-align:center, 가로 100..440px 안(폭 최대 340px).
   가운데 배치는 바깥 래퍼(.row: left:0; right:0; flex; justify-content:center)로만.
   애니메이션(scale·translateY)은 안쪽 요소(.in)에만. translateX(-50%)·left 고정값 금지.
   세로: 배지 118 · 제목 142(2줄, ≤34px) · 카운터 제목 바로 아래 · 팝 300~460 · 자막 640.
   위 115px 위·아래 720px 아래 중요한 글자 금지. 검사: window.hudCheck() (engine.js), crop=880:1920:100:0 */
html,body{margin:0;padding:0;background:#000;}
#stage{position:relative;width:540px;height:960px;overflow:hidden;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-weight:900;}
canvas{position:absolute;left:0;top:0;width:540px;height:960px;}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none;}
.row>.in{max-width:340px;text-align:center;word-break:keep-all;}
#badgeRow{top:118px;}
#badge{display:inline-block;border:2.5px solid #fff;border-radius:10px;padding:1px 10px 3px;font-size:15px;color:#fff;background:rgba(255,107,129,.92);letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.35);}
#titleRow{top:144px;}
#title{font-size:30px;line-height:1.18;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 12px rgba(0,0,0,.55);-webkit-text-stroke:1.5px rgba(0,0,0,.6);paint-order:stroke fill;}
#title .y{color:#ffe14d;}
#counterRow{top:222px;}
#counter{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6);transform-origin:center top;display:flex;flex-direction:column;align-items:center;}
#counter .lab{font-size:17px;display:inline-block;background:rgba(0,0,0,.55);padding:2px 9px;border-radius:8px;}
#counter .num{font-size:48px;line-height:1.05;-webkit-text-stroke:5px #111;paint-order:stroke fill;white-space:nowrap;}
#counter .num small{font-size:26px;margin-left:3px;}
#counter .sub{font-size:15px;margin-top:4px;color:#ffe14d;-webkit-text-stroke:3px #111;paint-order:stroke fill;}
#popRow{top:338px;}
#pop{font-size:44px;color:#fff;-webkit-text-stroke:7px #111;paint-order:stroke fill;white-space:nowrap;transform-origin:center center;}
#subRow{top:640px;}
#sub{font-size:29px;line-height:1.25;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill;}
#sub .q{color:#ffe14d;}
#endRow{top:300px;opacity:0;}
#end{width:320px;color:#fff;transform-origin:center center;}
#end .card{background:rgba(20,20,28,.82);border:3px solid #fff;border-radius:24px;padding:20px 12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
#end .ep{display:inline-block;font-size:32px;border:3px solid #fff;border-radius:14px;padding:2px 14px 6px;background:#ff6b81;}
#end .share{font-size:25px;line-height:1.32;margin-top:14px;color:#ffe14d;word-break:keep-all;}
#end .next{font-size:17px;margin-top:12px;color:#ddd;font-weight:700;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;}

</style>
<style>
  #endRow #end .next{font-size:22px;color:#fff;}
  #counterRow{top:190px;}
  #counter .sub{display:inline-block;font-size:17px;margin-top:5px;padding:1px 10px 2px;border-radius:9px;background:rgba(0,0,0,.5);-webkit-text-stroke:0;color:#ffe14d;}
  #popRow{top:318px;}
  #rew{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 3px,rgba(0,0,0,0) 3px 9px);}
  #end .neon{display:inline-block;font-size:30px;color:#fff;letter-spacing:2px;padding:2px 14px 4px;border:3px solid #ff5fa2;border-radius:12px;text-shadow:0 0 6px #ff5fa2,0 0 14px #ff5fa2;box-shadow:0 0 12px rgba(255,95,162,.8),inset 0 0 10px rgba(255,95,162,.6);margin-bottom:12px;}
  #end .ep{font-size:26px;}
  #end .share{font-size:24px;}
</style></head>
<body><div id="stage">
<canvas id="c" width="1080" height="1920"></canvas>
<div id="rew"></div>
<div class="row" id="badgeRow"><div class="in"><span id="badge" class="t">만약에 EP05</span></div></div>
<div class="row" id="titleRow"><div class="in t" id="title">만약 <span class="y">힌트</span> 쓸 때마다?</div></div>
<div class="row" id="counterRow"><div class="in" id="counter"><div class="lab t">담장 높이</div><div class="num t">2,048<small>m</small></div><div class="sub t">힌트 10회</div></div></div>
<div class="row" id="popRow"><div class="in t" id="pop"></div></div>
<div class="row" id="subRow"><div class="in t" id="sub"></div></div>
<div class="row" id="endRow"><div class="in" id="end"><div class="card"><div class="neon t">탈출카페</div><br><div class="ep t">만약에 EP05</div><div class="share t">방탈출 가면 힌트부터<br>찾는 친구한테 보내기</div><div class="next t">다음 만약에는 수요일 저녁 7시</div></div></div></div>
<div id="flash"></div>
</div>
<script>
// 만약에 3D mini engine (WebGL1, no dependencies)
// Usage: const E = MiniEngine(canvas); E.begin(cam); E.draw(mesh, matrix, opts); E.end();
(function (global) {
  'use strict';
  // ---------- math (column-major 4x4) ----------
  const M4 = {
    I() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
    mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
        let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
        o[c * 4 + r] = s;
      }
      return o;
    },
    T(x, y, z) { const m = M4.I(); m[12] = x; m[13] = y; m[14] = z; return m; },
    S(x, y, z) { const m = M4.I(); m[0] = x; m[5] = (y === undefined ? x : y); m[10] = (z === undefined ? x : z); return m; },
    RX(a) { const m = M4.I(), c = Math.cos(a), s = Math.sin(a); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
    RY(a) { const m = M4.I(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
    RZ(a) { const m = M4.I(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },
    persp(fovy, asp, n, f) {
      const t = 1 / Math.tan(fovy / 2), m = new Float32Array(16);
      m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m;
    },
    lookAt(e, c, u) {
      let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
      let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
      let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx;
      l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
      const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
      const m = M4.I();
      m[0] = xx; m[4] = xy; m[8] = xz; m[1] = yx; m[5] = yy; m[9] = yz; m[2] = zx; m[6] = zy; m[10] = zz;
      m[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
      m[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
      m[14] = -(zx * e[0] + zy * e[1] + zz * e[2]);
      return m;
    },
    // chain helper: M4.chain(T(...), RY(...), S(...))
    chain(...ms) { let o = ms[0]; for (let i = 1; i < ms.length; i++) o = M4.mul(o, ms[i]); return o; },
    normal3(m) {
      const a = m[0], b = m[4], c = m[8], d = m[1], e = m[5], f = m[9], g = m[2], h = m[6], i = m[10];
      const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
      const D = -(b * i - c * h), E = a * i - c * g, F = -(a * h - b * g);
      const G = b * f - c * e, H = -(a * f - c * d), I = a * e - b * d;
      let det = a * A + b * B + c * C; if (Math.abs(det) < 1e-12) det = 1e-12;
      // inverse transpose = cofactor / det, column-major
      return new Float32Array([A / det, B / det, C / det, D / det, E / det, F / det, G / det, H / det, I / det]);
    },
    apply(m, p) {
      return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]];
    }
  };

  // ---------- helpers ----------
  function hex(h) { const n = parseInt(h.replace('#', ''), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const easeOutBack = (t) => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

  // ---------- mesh generators (non-indexed) ----------
  function sphereGeo(lat, lon, thetaMax) {
    thetaMax = thetaMax || Math.PI;
    const P = [], N = [], U = [];
    const pt = (i, j) => {
      const th = i / lat * thetaMax, ph = j / lon * Math.PI * 2;
      const x = Math.sin(th) * Math.sin(ph), y = Math.cos(th), z = Math.sin(th) * Math.cos(ph);
      return [x * 0.5, y * 0.5, z * 0.5, x, y, z, j / lon, 1 - i / lat];
    };
    for (let i = 0; i < lat; i++) for (let j = 0; j < lon; j++) {
      const a = pt(i, j), b = pt(i + 1, j), c = pt(i + 1, j + 1), d = pt(i, j + 1);
      for (const v of [a, b, c, a, c, d]) { P.push(v[0], v[1], v[2]); N.push(v[3], v[4], v[5]); U.push(v[6], v[7]); }
    }
    return { P, N, U };
  }
  function pushFlatTri(G, a, b, c, ua, ub, uc) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    for (const p of [a, b, c]) { G.P.push(p[0], p[1], p[2]); G.N.push(nx, ny, nz); }
    G.U.push(...(ua || [0, 0]), ...(ub || [1, 0]), ...(uc || [1, 1]));
  }
  function boxGeo() {
    const G = { P: [], N: [], U: [] };
    const f = (a, b, c, d) => { pushFlatTri(G, a, b, c, [0, 0], [1, 0], [1, 1]); pushFlatTri(G, a, c, d, [0, 0], [1, 1], [0, 1]); };
    const h = 0.5, v = (x, y, z) => [x * h, y * h, z * h];
    f(v(-1, -1, 1), v(1, -1, 1), v(1, 1, 1), v(-1, 1, 1));
    f(v(1, -1, -1), v(-1, -1, -1), v(-1, 1, -1), v(1, 1, -1));
    f(v(1, -1, 1), v(1, -1, -1), v(1, 1, -1), v(1, 1, 1));
    f(v(-1, -1, -1), v(-1, -1, 1), v(-1, 1, 1), v(-1, 1, -1));
    f(v(-1, 1, 1), v(1, 1, 1), v(1, 1, -1), v(-1, 1, -1));
    f(v(-1, -1, -1), v(1, -1, -1), v(1, -1, 1), v(-1, -1, 1));
    return G;
  }
  // cylinder along y, height 1 (-0.5..0.5); rTop/rBot radius; smooth sides
  function cylGeo(seg, rTop, rBot, caps, flat, noise) {
    const G = { P: [], N: [], U: [] };
    const R = rng(77);
    const jit = [];
    for (let j = 0; j <= seg; j++) jit.push(j === seg ? jit[0] : 1 + (noise ? (R() - 0.5) * noise : 0));
    const slope = (rBot - rTop);
    for (let j = 0; j < seg; j++) {
      const a0 = j / seg * Math.PI * 2, a1 = (j + 1) / seg * Math.PI * 2;
      const p = (a, r, y, k) => [Math.sin(a) * r * jit[k], y, Math.cos(a) * r * jit[k]];
      const b0 = p(a0, rBot, -0.5, j), b1 = p(a1, rBot, -0.5, j + 1), t0 = p(a0, rTop, 0.5, j), t1 = p(a1, rTop, 0.5, j + 1);
      if (flat) {
        pushFlatTri(G, b0, b1, t1, [j / seg, 0], [(j + 1) / seg, 0], [(j + 1) / seg, 1]);
        if (rTop > 0.0001) pushFlatTri(G, b0, t1, t0, [j / seg, 0], [(j + 1) / seg, 1], [j / seg, 1]);
      } else {
        const n = (a) => { const nx = Math.sin(a), nz = Math.cos(a), ny = slope; const l = Math.hypot(nx, ny, nz); return [nx / l, ny / l, nz / l]; };
        const n0 = n(a0), n1 = n(a1);
        const tri = [[b0, n0, [j / seg, 0]], [b1, n1, [(j + 1) / seg, 0]], [t1, n1, [(j + 1) / seg, 1]], [b0, n0, [j / seg, 0]], [t1, n1, [(j + 1) / seg, 1]], [t0, n0, [j / seg, 1]]];
        for (const [pp, nn, uu] of tri) { G.P.push(...pp); G.N.push(...nn); G.U.push(...uu); }
      }
      if (caps) {
        if (rTop > 0.0001) { const c = [0, 0.5, 0]; for (const [pp, uu] of [[c, [0.5, 0.5]], [t0, [0, 0]], [t1, [1, 0]]]) { G.P.push(...pp); G.N.push(0, 1, 0); G.U.push(...uu); } }
        const c = [0, -0.5, 0]; for (const [pp, uu] of [[c, [0.5, 0.5]], [b1, [1, 0]], [b0, [0, 0]]]) { G.P.push(...pp); G.N.push(0, -1, 0); G.U.push(...uu); }
      }
    }
    return G;
  }
  // disc in XY plane facing +z, radius 0.5
  function discGeo(seg) {
    const G = { P: [], N: [], U: [] };
    for (let j = 0; j < seg; j++) {
      const a0 = j / seg * Math.PI * 2, a1 = (j + 1) / seg * Math.PI * 2;
      const pts = [[0, 0], [Math.cos(a0) * 0.5, Math.sin(a0) * 0.5], [Math.cos(a1) * 0.5, Math.sin(a1) * 0.5]];
      for (const p of pts) { G.P.push(p[0], p[1], 0); G.N.push(0, 0, 1); G.U.push(p[0] + 0.5, p[1] + 0.5); }
    }
    return G;
  }
  function quadGeo() {
    const G = { P: [], N: [], U: [] };
    const v = [[-0.5, -0.5, 0, 0], [0.5, -0.5, 1, 0], [0.5, 0.5, 1, 1], [-0.5, -0.5, 0, 0], [0.5, 0.5, 1, 1], [-0.5, 0.5, 0, 1]];
    for (const p of v) { G.P.push(p[0], p[1], 0); G.N.push(0, 0, 1); G.U.push(p[2], p[3]); }
    return G;
  }
  // triangular prism (triangle kimbap shape) axis z, slightly rounded by bevel
  function prismGeo() {
    const G = { P: [], N: [], U: [] };
    const tri = [[0, 0.5], [-0.5, -0.36], [0.5, -0.36]];
    const d = 0.19;
    const F = tri.map(p => [p[0], p[1], d]), B = tri.map(p => [p[0], p[1], -d]);
    pushFlatTri(G, F[0], F[1], F[2], [0.5, 1], [0, 0], [1, 0]);
    pushFlatTri(G, B[0], B[2], B[1], [0.5, 1], [1, 0], [0, 0]);
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3;
      pushFlatTri(G, F[i], B[i], B[j]); pushFlatTri(G, F[i], B[j], F[j]);
    }
    return G;
  }

  function MiniEngine(canvas) {
    const gl = canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true, alpha: false });
    if (!gl) throw new Error('no webgl');
    gl.getExtension('OES_standard_derivatives');
    const VS = `attribute vec3 aP;attribute vec3 aN;attribute vec2 aU;uniform mat4 uM;uniform mat4 uVP;uniform mat3 uNM;
      varying vec3 vN;varying vec3 vW;varying vec2 vU;
      void main(){vec4 w=uM*vec4(aP,1.0);vW=w.xyz;vN=uNM*aN;vU=aU;gl_Position=uVP*w;}`;
    const FS = `precision highp float;varying vec3 vN;varying vec3 vW;varying vec2 vU;
      uniform vec3 uC;uniform vec3 uCam;uniform vec3 uL;uniform vec3 uFog;uniform vec3 uSky;uniform vec3 uGnd;
      uniform float uFN;uniform float uFF;uniform float uA;uniform float uEm;uniform float uSp;uniform float uTx;uniform sampler2D uT;uniform vec2 uTR;
      void main(){vec3 N=normalize(vN);if(!gl_FrontFacing)N=-N;vec3 base=uC;float a=uA;
        if(uTx>0.5){vec4 t=texture2D(uT,vU*uTR);base*=t.rgb;a*=t.a;}
        if(a<0.01)discard;
        vec3 V=normalize(uCam-vW);vec3 L=normalize(uL);float ndl=max(dot(N,L),0.0);
        vec3 amb=mix(uGnd,uSky,N.y*0.5+0.5);vec3 H=normalize(L+V);
        float sp=pow(max(dot(N,H),0.0),48.0)*uSp;float rim=pow(1.0-max(dot(N,V),0.0),3.0)*0.32;
        vec3 c=base*(amb*0.62+ndl*vec3(1.0,0.97,0.92)*0.72)+vec3(sp)+rim*vec3(1.0,0.96,0.92);
        c=mix(c,base,uEm);
        float d=length(uCam-vW);float f=clamp((d-uFN)/(uFF-uFN),0.0,1.0);f=f*f;
        c=mix(c,uFog,f);gl_FragColor=vec4(c,a);}`;
    const BVS = `attribute vec2 aP;varying float vY;void main(){vY=aP.y*0.5+0.5;gl_Position=vec4(aP,0.999,1.0);}`;
    const BFS = `precision mediump float;varying float vY;uniform vec3 uTop;uniform vec3 uBot;void main(){gl_FragColor=vec4(mix(uBot,uTop,smoothstep(0.0,1.0,vY)),1.0);}`;
    function prog(vs, fs) {
      const p = gl.createProgram();
      for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
        const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
        gl.attachShader(p, sh);
      }
      gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
      return { p, u, aP: gl.getAttribLocation(p, 'aP'), aN: gl.getAttribLocation(p, 'aN'), aU: gl.getAttribLocation(p, 'aU') };
    }
    const MP = prog(VS, FS), BP = prog(BVS, BFS);
    const bgBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    function mesh(G) {
      const mk = (a) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(a), gl.STATIC_DRAW); return b; };
      return { p: mk(G.P), n: mk(G.N), u: mk(G.U), count: G.P.length / 3 };
    }
    const meshes = {
      sphere: mesh(sphereGeo(16, 24)),
      hemi: mesh(sphereGeo(8, 24, Math.PI / 2)),
      box: mesh(boxGeo()),
      cyl: mesh(cylGeo(18, 0.5, 0.5, true)),
      cone: mesh(cylGeo(18, 0.0, 0.5, true)),
      disc: mesh(discGeo(28)),
      quad: mesh(quadGeo()),
      prism: mesh(prismGeo()),
      mountain: mesh(cylGeo(28, 0.0, 0.5, false, true, 0.18)),

  else L = BW(-0.44, 0.56 - slump * 0.05, 0.05);
  arm2(SH(-1), L, out(-1), shirt); sph(L, 0.09, skin);
  // 오른팔(+x, 버튼 쪽)
  if (mode === 'press' || mode === 'release') {
    const P = btnFace(BTN, t);
    // video #5: 손바닥을 버튼 아래쪽 가장자리에 대고 눌러 라벨 '힌트'가 가려지지 않게
    let hand = v3.add(v3.add(P, v3.mul(NW, 0.05)), v3.add(v3.mul(TW, -0.04), [0, -0.26, 0]));
    if (t >= 10.8 && t < 11.0) hand = v3.add(hand, v3.mul(NW, 0.3 * (1 - smooth(10.8, 10.98, t)) + 0.04 * Math.sin(t * 50))); // 쭈뼛쭈뼛
    if (mode === 'release') hand = v3.add(hand, v3.add(v3.mul(NW, 0.2), [0, -0.12, 0]));
    if (t >= 1.9 && t < 1.96) hand = v3.lerp(BW(0.44, 0.56, 0.05), hand, smooth(1.9, 1.96, t));
    const sh = SH(1);
    arm2(sh, v3.add(hand, v3.mul(NW, 0.08)), [0, -1, 0.3], shirt);
    // 손바닥: 버튼 면에 납작하게
    D(m.sphere, M4.mul(basis(hand, [0, 1, 0], NW, 1), M4.S(0.17, 0.19, 0.08)), skin, { spec: 0.3 });
  } else {
    let R2;
    if (mode === 'hips') R2 = BW(0.36, 0.7, 0.06);
    else if (mode === 'sit') R2 = BW(0.16, 0.6, 0.42);
    else R2 = BW(0.44, 0.56, 0.05);
    arm2(SH(1), R2, out(1), shirt); sph(R2, 0.09, skin);
  }
  if (!inCafe(t)) shadow(HP, 0.55, 0.35);
  return Hd;
}
function drawGuard(t) {
  if (t < 6.8 || t >= 7.8) return;
  const base = M4.chain(M4.T(GUARD[0], 0, GUARD[2]), M4.RY(0.55));
  const up = smooth(6.9, 7.15, t);
  const pitch = lerp(-0.55, -0.95, up);
  const Hd = drawCharacter(E, base, { shirt: '#3550a0', hair: 'short', pants: '#1f2a44', noArms: true, headPitch: pitch, surprise: lerp(0.2, 1.3, up), mouth: lerp(0.2, 1.1, up), blink: 0 });
  window.__gh = M4.apply(Hd, [0, 0, 0]);
  D(m.box, M4.chain(base, M4.T(0.18, 1.1, 0.27), M4.S(0.12, 0.12, 0.02)), '#ffd23f', { spec: 0.8 }); // 배지
  // 쌍안경(눈앞)
  // video #5: 놀라서 쌍안경을 배 높이로 내림(6.95~7.15초) → 얼굴이 보이고 팔·쌍안경이 주인공 얼굴 쪽으로 가지 않음
  const low = smooth(6.95, 7.15, t);
  const binP = (s) => v3.lerp(M4.apply(Hd, [0.15 * s, -0.08, 0.6]), M4.apply(base, [0.15 * s, 0.95, 0.3]), low);
  for (const s of [-1, 1]) { const q = binP(s);
    if (low < 0.5) D(m.cyl, M4.chain(Hd, M4.T(0.15 * s, lerp(-0.08, -0.5, low), 0.6), M4.RX(Math.PI / 2), M4.S(0.17, 0.3, 0.17)), '#1c1c22', { spec: 0.7 });
    else D(m.cyl, M4.chain(M4.T(q[0], q[1], q[2]), M4.RY(0.55), M4.RX(Math.PI / 2), M4.S(0.17, 0.3, 0.17)), '#1c1c22', { spec: 0.7 }); }
  // 팔: 양손으로 쌍안경만 잡음
  for (const s of [-1, 1]) { const sh = M4.apply(base, [0.3 * s, 1.02, 0]); const h = v3.add(binP(1.8 * s), [0, -0.08, 0]); arm2(sh, h, M4.apply(M4.mul(base, M4.I()), [0.6 * s, -0.2, 0]).map((x, k) => x - M4.apply(base, [0, 0, 0])[k]), '#3550a0'); sph(h, 0.09, '#f3cdb8'); }
  // 모자: 7.2초에 뒤로 벗겨짐
  const fly = smooth(7.2, 7.75, t);
  const capL = M4.chain(Hd, M4.T(0, 0.36 + fly * 0.35, -0.05), M4.RX(-fly * 1.6));
  // 위로 튀었다가 오른쪽(화면 안쪽)으로 떨어짐 — 크롭 안 유지
  const capW = fly > 0 ? M4.mul(M4.T(0.45 * fly, 0.55 * fly - 0.75 * fly * fly, 0.25 * fly), capL) : capL;
  window.__gcap = M4.apply(capW, [0, 0, 0]);
  D(m.cyl, M4.chain(capW, M4.S(0.86, 0.22, 0.86)), '#25335f', { spec: 0.4 });
  D(m.cyl, M4.chain(capW, M4.T(0, -0.08, 0.3), M4.S(0.7, 0.04, 0.5)), '#111', { spec: 0.4 });
  D(m.sphere, M4.chain(capW, M4.T(0, 0.02, 0.43), M4.S(0.14, 0.12, 0.04)), '#ffd23f', { spec: 0.8 });
  shadow(GUARD, 0.55, 0.35);
}
function drawStaff(t) {
  if (!inCafe(t)) return;
  const base = M4.chain(M4.T(STAFF[0], 0, STAFF[2]), M4.RY(0.25));
  // 고개: 13.6초부터 모니터 쪽(왼쪽 위)으로, 15.3~15.6 까딱(모니터 시선 가리킴), 16.9초 주인공과 눈 마주침
  let yaw = 0, pitch = 0, gx = 0;
  if (t >= 13.6 && t < 16.9) { yaw = 0.75 * smooth(13.6, 13.9, t); pitch = -0.28 * smooth(13.6, 13.9, t) + (t >= 15.3 && t < 15.75 ? 0.22 * Math.sin((t - 15.3) / 0.45 * Math.PI) : 0); gx = 0.6; }
  if (t >= 16.9) { yaw = lerp(0.75, -0.55, smooth(16.9, 17.2, t)); pitch = lerp(-0.28, 0.05, smooth(16.9, 17.2, t)); gx = -0.6; }
  const Hd = drawCharacter(E, base, { shirt: '#2fbf71', hair: 'short', pants: '#26262e', noArms: true, headYaw: yaw, headPitch: pitch, gazeX: gx, mouth: 0.15, blink: 0 });
  window.__sh = M4.apply(Hd, [0, 0, 0]);
  // 앞치마
  D(m.sphere, M4.chain(base, M4.T(0, 0.72, 0.03), M4.S(0.6, 0.56, 0.53)), '#263044', { spec: 0.2 });
  // 헤드셋
  for (let i = 0; i <= 8; i++) { const a = Math.PI * i / 8; D(m.sphere, M4.chain(Hd, M4.T(Math.cos(a) * 0.47, Math.sin(a) * 0.47 - 0.02, -0.02), M4.S(0.07)), '#1c1c22', { spec: 0.6 }); }
  for (const s of [-1, 1]) D(m.sphere, M4.chain(Hd, M4.T(0.46 * s, -0.06, 0), M4.S(0.1, 0.18, 0.16)), '#1c1c22', { spec: 0.6 });
  sph(M4.apply(Hd, [-0.44, -0.24, 0.12]), 0.05, '#1c1c22');
  // 팔: 내린 채
  for (const s of [-1, 1]) { const sh = M4.apply(base, [0.3 * s, 1.02, 0]); const h = M4.apply(base, [0.42 * s, 0.55, 0.04]); arm2(sh, h, v3.sub(M4.apply(base, [0.7 * s, 0.8, -0.1]), M4.apply(base, [0, 0.8, 0])), '#2fbf71'); sph(h, 0.09, '#f3cdb8'); }
}

// ---------------- camera ----------------
const HEAD = [HP[0], 1.55, HP[2]];
const COLD = { pos: wl(-1.3, 0.85, 2.75), look: wl(-0.5, 2.3, 0.0), fov: 66 };
const MED = { pos: [-1.05, 1.75, 3.75], look: [0.18, 1.55, -0.45], fov: 40 };
const GROW = { pos: wl(-2.6, 1.3, 6.5), look: wl(-0.3, 3.2, 0.3), fov: 54 };
const LOWUP = { pos: wl(-1.45, 1.0, 2.95), look: wl(-0.72, 2.05, 0.0), fov: 60 };
const WORM = { pos: wl(-4.5, 0.8, 10), look: wl(0, 13, 0), fov: 66 };
const GUARDC = { pos: [-0.97, 1.3, 5.3], look: [-0.64, 2.0, 0.3], fov: 56 };
const PLANEC = { pos: wl(-3.4, 1.2, 7.5), look: wl(-0.8, 4.6, 0.5), fov: 58 };
const BC = v3.add(BTN, v3.add(v3.mul(NW, 1.3), v3.add(v3.mul(TW, 0.55), [0, 0.18, 0])));
const BTNC = { pos: BC, look: v3.add(BTN, v3.add(v3.mul(TW, -0.1), [0, -0.04, 0])), fov: 42 };
const MED2 = { pos: [-0.95, 1.75, 3.3], look: [0.22, 1.56, -0.56], fov: 42 };
const SPACEC = { pos: wl(-0.5, 1.6, 3.4), look: wl(-1.3, 1.25, 0.3), fov: 58 };
const WIDE = { pos: wl(-0.85, 2.5, 7.2), look: wl(-1.15, 1.55, 0.3), fov: 54 };
const CAFEM = { pos: wl(-1.2, 1.75, 5.6), look: wl(-1.25, 1.25, 0.6), fov: 62 };
const ENDC = { pos: wl(-0.85, 2.6, 7.8), look: wl(-1.15, 1.55, 0.3), fov: 54 };
// video #4: 카메라 측면 이동·팬·화각 보정(search.js 로 머리·힌트 간판 크롭 안전 x 50~475 탐색)
function adj(B, qx, px, py, df) { const f = v3.norm(v3.sub(B.look, B.pos)); const r = v3.norm([-f[2], 0, f[0]]); return { pos: v3.add(B.pos, v3.mul(r, qx)), look: v3.add(B.look, v3.add(v3.mul(r, px), [0, py, 0])), fov: B.fov + df }; }
// video #5: COLD·LOWUP 카메라를 오른쪽·뒤로 옮겨 주인공이 힌트 간판 라벨을 가리지 않게(간판은 주인공 오른쪽 옆 빈 벽에)
Object.assign(COLD, { pos: wl(-0.55, 0.9, 4.4), look: wl(-0.58, 2.15, 0), fov: 56 });
Object.assign(MED, adj(MED, -0.4, 0.2, 0, 12));
Object.assign(MED2, adj(MED2, -0.8, 0.2, 0, 12));
Object.assign(SPACEC, adj(SPACEC, 0, 0.6, 0.1, 12));
Object.assign(GUARDC, adj(GUARDC, -0.8, 0.2, -0.3, 8));
Object.assign(GUARDC, adj(GUARDC, 0, -0.25, 0, 0)); // video #5: 경비원을 왼쪽으로 옮긴 만큼 팬
Object.assign(GROW, { pos: wl(-1.0, 1.2, 6.6), look: wl(-0.3, 3.2, 0.3), fov: 54 }); // video #5: 주인공 머리가 간판 라벨을 가리지 않게
Object.assign(LOWUP, { pos: wl(-0.5, 0.8, 4.2), look: wl(-0.6, 2.05, 0), fov: 58 });
const BUMP = -0.08;
const mixCam = (A, B, u) => ({ pos: v3.lerp(A.pos, B.pos, u), look: v3.lerp(A.look, B.look, u), fov: lerp(A.fov, B.fov, u) });
const zoomed = (B, f) => ({ pos: B.pos, look: B.look, fov: f });
const SHOTS = [
  { t0: 0, snap: true, target: (t) => zoomed(COLD, COLD.fov - 2.5 * t) },
  { t0: 0.8, snap: true, target: (t) => { const u = smooth(0.8, 1.08, t); const C = mixCam(zoomed(COLD, COLD.fov - 2), MED, u); return adj(C, 0, BUMP * Math.sin(Math.PI * u), 0, 0); } },
  { t0: 1.1, snap: true, target: (t) => zoomed(MED, 52 - 1.5 * (t - 1.1)) },
  { t0: 2.1, w: 4.5, target: (t) => GROW },
  { t0: 3.6, snap: true, target: (t) => ({ pos: LOWUP.pos, look: v3.add(LOWUP.look, [0, 0.8 * (t - 3.6), 0]), fov: LOWUP.fov }) },
  { t0: 5.8, snap: true, target: (t) => ({ pos: WORM.pos, look: v3.add(WORM.look, [0, 4 * smooth(5.9, 6.8, t), 0]), fov: WORM.fov }) },
  { t0: 6.8, snap: true, target: (t) => zoomed(GUARDC, 72 - 1.2 * (t - 6.8)) },
  { t0: 7.8, snap: true, target: (t) => zoomed(PLANEC, 64 - 1.5 * (t - 7.8)) },
  { t0: 9.4, snap: true, target: (t) => zoomed(BTNC, 40 - 2 * (t - 9.4)) },
  { t0: 10.8, snap: true, target: (t) => zoomed(MED2, 55 - 1 * (t - 10.8)) },
  { t0: 12.0, snap: true, target: (t) => zoomed(SPACEC, 72 - 1.5 * (t - 12)) },
  { t0: T_REV, snap: true, target: (t) => mixCam(MED2, WIDE, 0.78 + 0.22 * easeOut((t - T_REV) / 0.3)) },
  { t0: 15.2, w: 3, target: (t) => CAFEM },
  { t0: ENDT, w: 3, target: (t) => ENDC },
];
function shakeAt(t) {
  let s = 0;
  for (const r of RES) { const d = t - r; const amp = r === 6.2 || r === 6.6 ? 0.06 : (r === 11.1 ? 0.08 : (r > 7.7 && r < 9.4 ? 0.015 : 0.035)); if (d >= 0 && d < 0.35) s = Math.max(s, amp * (1 - d / 0.35)); }
  for (const [a, amp] of [[0.0, 0.03], [T_REV, 0.04], [13.75, 0.05]]) { const d = t - a; if (d >= 0 && d < 0.35) s = Math.max(s, amp * (1 - d / 0.35)); }
  if (t < 0.8) s = Math.max(s, 0.012);
  return s ? [Math.sin(t * 71) * s, Math.cos(t * 53) * s, 0] : null;
}
function envAt(t) {
  if (inCafe(t)) return { skyTop: [0.15, 0.1, 0.22], skyBot: [0.1, 0.07, 0.15], light: [-0.3, 1.0, 0.8], fog: [0.2, 0.15, 0.3], amb: [0.95, 0.85, 1.0], gnd: [0.45, 0.35, 0.5], fogNear: 2500, fogFar: 4000 };
  const sp = t >= 12.0;
  return { skyTop: [0.03, 0.05, 0.15], skyBot: [0.1, 0.12, 0.3], light: [-0.45, 1.0, 0.7], fog: [0.1, 0.12, 0.25], amb: sp ? [0.75, 0.78, 0.95] : [0.72, 0.78, 1.0], gnd: [0.35, 0.36, 0.48], fogNear: 2500, fogFar: 4000 };
}

// ---------------- scene ----------------
let CUR_CAM = null;
function scene(t) {
  if (!inCafe(t)) skyQuad(CUR_CAM, t >= 12.0 ? SKY.space : SKY.night);
  drawGround(t);
  drawWall(t);
  drawButton(t, inCafe(t) ? CBTN : BTN);
  drawClouds(t);
  drawLowClouds(t);
  drawPlane(t);
  drawEarth(t);
  drawHero(t);
  drawGuard(t);
  drawStaff(t);
}

// ---------------- HUD ----------------
const SUBS = [
  [1.1, 1.9, '열 번에 구름 뚫었어.'], // 0~1.1초는 얼굴과 겹쳐 생략(0초 글자 3개 유지)
  // 2.4~4.82 '한 번 누르니 담장이 두 배!'는 팝1(2.2~3.4)과 같은 말이라 자막 생략
  [11.1, 12.96, '스무 번 누르니 우주야.'],
  // 13.6~16.19 '알고 보니 방탈출 카페였어.'는 팝2(13.5~15.1)와 같은 말이라 자막 생략
  [16.8, 18.0, '힌트 먼저 찾는 친구 알지?'],
];
const POPS = [
  [2.2, 3.4, '힌트 1번 = 담장 2배!', 30, '#ffe14d'],
  [13.5, 15.1, '알고 보니 방탈출 카페!', 30, '#ffe14d'],
];
let popKey = '';
function hud(t) {
  const s = SUBS.find(([a, b]) => t >= a && t < b);
  $('sub').innerHTML = s ? s[2] : '';
  $('subRow').style.opacity = s && t < ENDT ? 1 : 0;
  const C = $('counter'), c = countAt(t);
  const hf = smooth(13.3, 13.4, t); // 반전 0.1초 전부터 제목·배지·카운터 페이드아웃(카페 간판과 겹침 방지)
  const showC = t < T_REV;
  $('counterRow').style.opacity = (1 - hf).toFixed(3);
  if (showC) {
    C.querySelector('.num').innerHTML = meters(c).toLocaleString('en-US') + '<small>m</small>';
    fitText(C.querySelector('.num'), 48, 300, 30);
    C.querySelector('.sub').textContent = `힌트 ${c}회`;
    let lc = -9; for (let tt = t; tt > t - 0.3; tt -= 1 / 60) { if (countAt(tt) !== c) { lc = tt; break; } }
    let sc = 1 + 0.16 * Math.exp(-(t - lc) * 12);
    if (t >= 11.1 && t < 11.7) sc = 1 + 0.25 * Math.exp(-(t - 11.1) * 7);
    C.style.transform = `scale(${sc.toFixed(3)})`;
  }
  const P = $('pop'), p = POPS.find(([a, b]) => t >= a && t < b);
  if (p && t < ENDT) {
    const u = (t - p[0]) / (p[1] - p[0]); const sc = easeOutBack(Math.min(1, u * 5));
    const key = p[2] + p[3];
    if (key !== popKey) { P.textContent = p[2]; fitText(P, p[3], 330, 22); popKey = key; }
    P.style.color = p[4] || '#fff';
    P.style.transform = `scale(${Math.max(0.01, sc).toFixed(3)})`;
    $('popRow').style.opacity = u > 0.88 ? (1 - (u - 0.88) / 0.12).toFixed(3) : 1;
  } else $('popRow').style.opacity = 0;
  const rw = t >= 0.8 && t < 1.1;
  $('rew').style.opacity = rw ? 0.9 : 0;
  $('c').style.filter = rw ? 'saturate(0.45) contrast(1.15) blur(1px)' : (t >= ENDT ? 'brightness(0.6) blur(2.5px)' : 'none');
  let fl = 0; for (const [ft, a] of [[0.8, 0.45], [1.1, 0.3], [6.2, 0.25], [11.1, 0.35], [12.0, 0.3], [T_REV, 0.45]]) { const d = t - ft; if (d >= 0 && d < 0.3) fl = Math.max(fl, a * (1 - d / 0.3)); }
  $('flash').style.opacity = fl.toFixed(3);
  const ec = smooth(ENDT, ENDT + 0.25, t);
  $('endRow').style.opacity = ec.toFixed(3);
  $('end').style.transform = `scale(${(0.85 + 0.15 * easeOutBack((t - ENDT) / 0.35)).toFixed(3)})`;
  const cf = hf;
  $('titleRow').style.opacity = (1 - cf).toFixed(3);
  $('badgeRow').style.opacity = (1 - cf).toFixed(3);
}

window.DURATION = DURATION;
window.proj = (p) => { const v = window.__vp; const x = v[0] * p[0] + v[4] * p[1] + v[8] * p[2] + v[12], y = v[1] * p[0] + v[5] * p[1] + v[9] * p[2] + v[13], w = v[3] * p[0] + v[7] * p[1] + v[11] * p[2] + v[15]; return [+((x / w * 0.5 + 0.5) * 540).toFixed(0), +((0.5 - y / w * 0.5) * 960).toFixed(0)]; };
window.renderAt = function (t) {
  const cam = window.CAM_OVERRIDE || springCamera(SHOTS, t, shakeAt(t));
  CUR_CAM = cam;
  E.begin(cam, envAt(t));
  scene(t);
  window.__vp = E.end();
  hud(t);
  return true;
};
window.renderAt(0);
</script>
