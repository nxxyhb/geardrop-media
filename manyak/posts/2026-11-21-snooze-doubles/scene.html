<style>
/* 만약에 공통 HUD v2 (EP04~) — 계정 주인 지시 '가운데 정렬' (CSS 540x960 기준)
   모든 글자 블록: 가로 중심 270px, text-align:center, 가로 100..440px 안(폭 최대 340px).
   가운데 배치는 바깥 래퍼(.row: left:0; right:0; flex; justify-content:center)로만.
   애니메이션(scale·translateY)은 안쪽 요소(.in)에만. translateX(-50%)·left 고정값 금지.
   세로: 배지 118 · 제목 142(2줄, ≤34px) · 카운터 제목 바로 아래 · 팝 300~460 · 자막 640.
   위 115px 위·아래 720px 아래 중요한 글자 금지. 검사: window.hudCheck() (engine.js), crop=880:1920:100:0 */

#stage{position:relative;width:540px;height:960px;overflow:hidden;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-weight:900;}
canvas{position:absolute;left:0;top:0;width:540px;height:960px;}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none;}
.row>.in{max-width:340px;text-align:center;word-break:keep-all;}
#badgeRow{top:118px;}
#badge{display:inline-block;border:2.5px solid #fff;border-radius:10px;padding:1px 10px 3px;font-size:15px;color:#fff;background:rgba(255,107,129,.92);letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.35);}
#titleRow{top:144px;}
#title{font-size:30px;line-height:1.18;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 12px rgba(0,0,0,.55);-webkit-text-stroke:1.5px rgba(0,0,0,.6);paint-order:stroke fill;}
#title .y{color:#ffe14d;}
#counterRow{top:222px;}
#counter{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6);transform-origin:center top;display:flex;flex-direction:column;align-items:center;}
#counter .lab{font-size:17px;display:inline-block;background:rgba(0,0,0,.55);padding:2px 9px;border-radius:8px;}
#counter .num{font-size:48px;line-height:1.05;-webkit-text-stroke:5px #111;paint-order:stroke fill;white-space:nowrap;}
#counter .num small{font-size:26px;margin-left:3px;}
#counter .sub{font-size:15px;color:#ffe14d;-webkit-text-stroke:3px #111;paint-order:stroke fill;}
#popRow{top:338px;}
#pop{font-size:44px;color:#fff;-webkit-text-stroke:7px #111;paint-order:stroke fill;white-space:nowrap;transform-origin:center center;}
#subRow{top:640px;}
#sub{font-size:29px;line-height:1.25;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill;}
#sub .q{color:#ffe14d;}
#endRow{top:300px;opacity:0;}
#end{width:320px;color:#fff;transform-origin:center center;}
#end .card{background:rgba(20,20,28,.82);border:3px solid #fff;border-radius:24px;padding:20px 12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
#end .ep{display:inline-block;font-size:32px;border:3px solid #fff;border-radius:14px;padding:2px 14px 6px;background:#ff6b81;}
#end .share{font-size:25px;line-height:1.32;margin-top:14px;color:#ffe14d;word-break:keep-all;}
#end .next{font-size:16px;margin-top:12px;color:#ddd;font-weight:700;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;}

<script>
// 만약에 3D mini engine (WebGL1, no dependencies)
// Usage: const E = MiniEngine(canvas); E.begin(cam); E.draw(mesh, matrix, opts); E.end();
(function (global) {
  'use strict';
  // ---------- math (column-major 4x4) ----------
  const M4 = {
    I() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
    mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
        let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
        o[c * 4 + r] = s;
      }
      return o;
    },
    T(x, y, z) { const m = M4.I(); m[12] = x; m[13] = y; m[14] = z; return m; },
    S(x, y, z) { const m = M4.I(); m[0] = x; m[5] = (y === undefined ? x : y); m[10] = (z === undefined ? x : z); return m; },
    RX(a) { const m = M4.I(), c = Math.cos(a), s = Math.sin(a); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
    RY(a) { const m = M4.I(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
    RZ(a) { const m = M4.I(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },
    persp(fovy, asp, n, f) {
      const t = 1 / Math.tan(fovy / 2), m = new Float32Array(16);
      m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m;
    },
    lookAt(e, c, u) {
      let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
      let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
      let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx;
      l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
      const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
      const m = M4.I();
      m[0] = xx; m[4] = xy; m[8] = xz; m[1] = yx; m[5] = yy; m[9] = yz; m[2] = zx; m[6] = zy; m[10] = zz;
      m[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
      m[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
      m[14] = -(zx * e[0] + zy * e[1] + zz * e[2]);

    },
    // chain helper: M4.chain(T(...), RY(...), S(...))
    chain(...ms) { let o = ms[0]; for (let i = 1; i < ms.length; i++) o = M4.mul(o, ms[i]); return o; },
    normal3(m) {
      const a = m[0], b = m[4], c = m[8], d = m[1], e = m[5], f = m[9], g = m[2], h = m[6], i = m[10];
      const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
      const D = -(b * i - c * h), E = a * i - c * g, F = -(a * h - b * g);
      const G = b * f - c * e, H = -(a * f - c * d), I = a * e - b * d;
      let det = a * A + b * B + c * C; if (Math.abs(det) < 1e-12) det = 1e-12;
      // inverse transpose = cofactor / det, column-major
      return new Float32Array([A / det, B / det, C / det, D / det, E / det, F / det, G / det, H / det, I / det]);
    },
    apply(m, p) {
      return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]];
    }
  };

  // ---------- helpers ----------
  function hex(h) { const n = parseInt(h.replace('#', ''), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const easeOutBack = (t) => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

  // ---------- mesh generators (non-indexed) ----------
  function sphereGeo(lat, lon, thetaMax) {
    thetaMax = thetaMax || Math.PI;

      const th = i / lat * thetaMax, ph = j / lon * Math.PI * 2;
      const x = Math.sin(th) * Math.sin(ph), y = Math.cos(th), z = Math.sin(th) * Math.cos(ph);
      return [x * 0.5, y * 0.5, z * 0.5, x, y, z, j / lon, 1 - i / lat];
    };
    for (let i = 0; i < lat; i++) for (let j = 0; j < lon; j++) {
      const a = pt(i, j), b = pt(i + 1, j), c = pt(i + 1, j + 1), d = pt(i, j + 1);
      for (const v of [a, b, c, a, c, d]) { P.push(v[0], v[1], v[2]); N.push(v[3], v[4], v[5]); U.push(v[6], v[7]); }
    }
    return { P, N, U };
  }
  function pushFlatTri(G, a, b, c, ua, ub, uc) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    for (const p of [a, b, c]) { G.P.push(p[0], p[1], p[2]); G.N.push(nx, ny, nz); }
    G.U.push(...(ua || [0, 0]), ...(ub || [1, 0]), ...(uc || [1, 1]));
  }
  function boxGeo() {
    const G = { P: [], N: [], U: [] };
    const f = (a, b, c, d) => { pushFlatTri(G, a, b, c, [0, 0], [1, 0], [1, 1]); pushFlatTri(G, a, c, d, [0, 0], [1, 1], [0, 1]); };
    const h = 0.5, v = (x, y, z) => [x * h, y * h, z * h];
    f(v(-1, -1, 1), v(1, -1, 1), v(1, 1, 1), v(-1, 1, 1));
    f(v(1, -1, -1), v(-1, -1, -1), v(-1, 1, -1), v(1, 1, -1));
    f(v(1, -1, 1), v(1, -1, -1), v(1, 1, -1), v(1, 1, 1));
    f(v(-1, -1, -1), v(-1, -1, 1), v(-1, 1, 1), v(-1, 1, -1));
    f(v(-1, 1, 1), v(1, 1, 1), v(1, 1, -1), v(-1, 1, -1));
    f(v(-1, -1, -1), v(1, -1, -1), v(1, -1, 1), v(-1, -1, 1));
    return G;
  }
  // cylinder along y, height 1 (-0.5..0.5); rTop/rBot radius; smooth sides
  function cylGeo(seg, rTop, rBot, caps, flat, noise) {
    const G = { P: [], N: [], U: [] };
    const R = rng(77);
    const jit = [];
    for (let j = 0; j <= seg; j++) jit.push(j === seg ? jit[0] : 1 + (noise ? (R() - 0.5) * noise : 0));
    const slope = (rBot - rTop);
    for (let j = 0; j < seg; j++) {
      const a0 = j / seg * Math.PI * 2, a1 = (j + 1) / seg * Math.PI * 2;
      const p = (a, r, y, k) => [Math.sin(a) * r * jit[k], y, Math.cos(a) * r * jit[k]];
      const b0 = p(a0, rBot, -0.5, j), b1 = p(a1, rBot, -0.5, j + 1), t0 = p(a0, rTop, 0.5, j), t1 = p(a1, rTop, 0.5, j + 1);
      if (flat) {
        pushFlatTri(G, b0, b1, t1, [j / seg, 0], [(j + 1) / seg, 0], [(j + 1) / seg, 1]);
        if (rTop > 0.0001) pushFlatTri(G, b0, t1, t0, [j / seg, 0], [(j + 1) / seg, 1], [j / seg, 1]);
      } else {
        const n = (a) => { const nx = Math.sin(a), nz = Math.cos(a), ny = slope; const l = Math.hypot(nx, ny, nz); return [nx / l, ny / l, nz / l]; };
        const n0 = n(a0), n1 = n(a1);
        const tri = [[b0, n0, [j / seg, 0]], [b1, n1, [(j + 1) / seg, 0]], [t1, n1, [(j + 1) / seg, 1]], [b0, n0, [j / seg, 0]], [t1, n1, [(j + 1) / seg, 1]], [t0, n0, [j / seg, 1]]];
        for (const [pp, nn, uu] of tri) { G.P.push(...pp); G.N.push(...nn); G.U.push(...uu); }
      }
      if (caps) {
        if (rTop > 0.0001) { const c = [0, 0.5, 0]; for (const [pp, uu] of [[c, [0.5, 0.5]], [t0, [0, 0]], [t1, [1, 0]]]) { G.P.push(...pp); G.N.push(0, 1, 0); G.U.push(...uu); } }
        const c = [0, -0.5, 0]; for (const [pp, uu] of [[c, [0.5, 0.5]], [b1, [1, 0]], [b0, [0, 0]]]) { G.P.push(...pp); G.N.push(0, -1, 0); G.U.push(...uu); }
      }
    }
    return G;
  }
  // disc in XY plane facing +z, radius 0.5
  function discGeo(seg) {
    const G = { P: [], N: [], U: [] };
    for (let j = 0; j < seg; j++) {
      const a0 = j / seg * Math.PI * 2, a1 = (j + 1) / seg * Math.PI * 2;
      const pts = [[0, 0], [Math.cos(a0) * 0.5, Math.sin(a0) * 0.5], [Math.cos(a1) * 0.5, Math.sin(a1) * 0.5]];
      for (const p of pts) { G.P.push(p[0], p[1], 0); G.N.push(0, 0, 1); G.U.push(p[0] + 0.5, p[1] + 0.5); }
    }
    return G;
  }
  function quadGeo() {
    const G = { P: [], N: [], U: [] };
    const v = [[-0.5, -0.5, 0, 0], [0.5, -0.5, 1, 0], [0.5, 0.5, 1, 1], [-0.5, -0.5, 0, 0], [0.5, 0.5, 1, 1], [-0.5, 0.5, 0, 1]];
    for (const p of v) { G.P.push(p[0], p[1], 0); G.N.push(0, 0, 1); G.U.push(p[2], p[3]); }
    return G;
  }
  // triangular prism (triangle kimbap shape) axis z, slightly rounded by bevel
  function prismGeo() {
    const G = { P: [], N: [], U: [] };
    const tri = [[0, 0.5], [-0.5, -0.36], [0.5, -0.36]];
    const d = 0.19;
    const F = tri.map(p => [p[0], p[1], d]), B = tri.map(p => [p[0], p[1], -d]);
    pushFlatTri(G, F[0], F[1], F[2], [0.5, 1], [0, 0], [1, 0]);
    pushFlatTri(G, B[0], B[2], B[1], [0.5, 1], [1, 0], [0, 0]);
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3;
      pushFlatTri(G, F[i], B[i], B[j]); pushFlatTri(G, F[i], B[j], F[j]);
    }
    return G;
  }

  function MiniEngine(canvas) {
    const gl = canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true, alpha: false });
    if (!gl) throw new Error('no webgl');
    gl.getExtension('OES_standard_derivatives');
    const VS = `attribute vec3 aP;attribute vec3 aN;attribute vec2 aU;uniform mat4 uM;uniform mat4 uVP;uniform mat3 uNM;
      varying vec3 vN;varying vec3 vW;varying vec2 vU;
      void main(){vec4 w=uM*vec4(aP,1.0);vW=w.xyz;vN=uNM*aN;vU=aU;gl_Position=uVP*w;}`;
    const FS = `precision highp float;varying vec3 vN;varying vec3 vW;varying vec2 vU;
      uniform vec3 uC;uniform vec3 uCam;uniform vec3 uL;uniform vec3 uFog;uniform vec3 uSky;uniform vec3 uGnd;
      uniform float uFN;uniform float uFF;uniform float uA;uniform float uEm;uniform float uSp;uniform float uTx;uniform sampler2D uT;uniform vec2 uTR;
      void main(){vec3 N=normalize(vN);if(!gl_FrontFacing)N=-N;vec3 base=uC;float a=uA;
        if(uTx>0.5){vec4 t=texture2D(uT,vU*uTR);base*=t.rgb;a*=t.a;}
        if(a<0.01)discard;
        vec3 V=normalize(uCam-vW);vec3 L=normalize(uL);float ndl=max(dot(N,L),0.0);
        vec3 amb=mix(uGnd,uSky,N.y*0.5+0.5);vec3 H=normalize(L+V);
        float sp=pow(max(dot(N,H),0.0),48.0)*uSp;float rim=pow(1.0-max(dot(N,V),0.0),3.0)*0.32;
        vec3 c=base*(amb*0.62+ndl*vec3(1.0,0.97,0.92)*0.72)+vec3(sp)+rim*vec3(1.0,0.96,0.92);
        c=mix(c,base,uEm);
        float d=length(uCam-vW);float f=clamp((d-uFN)/(uFF-uFN),0.0,1.0);f=f*f;
        c=mix(c,uFog,f);gl_FragColor=vec4(c,a);}`;
    const BVS = `attribute vec2 aP;varying float vY;void main(){vY=aP.y*0.5+0.5;gl_Position=vec4(aP,0.999,1.0);}`;
    const BFS = `precision mediump float;varying float vY;uniform vec3 uTop;uniform vec3 uBot;void main(){gl_FragColor=vec4(mix(uBot,uTop,smoothstep(0.0,1.0,vY)),1.0);}`;
    function prog(vs, fs) {
      const p = gl.createProgram();
      for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {

        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));

      gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
      return { p, u, aP: gl.getAttribLocation(p, 'aP'), aN: gl.getAttribLocation(p, 'aN'), aU: gl.getAttribLocation(p, 'aU') };
    }

    const bgBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

      const mk = (a) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(a), gl.STATIC_DRAW); return b; };
      return { p: mk(G.P), n: mk(G.N), u: mk(G.U), count: G.P.length / 3 };
    }
    const meshes = {
      sphere: mesh(sphereGeo(16, 24)),
      hemi: mesh(sphereGeo(8, 24, Math.PI / 2)),
      box: mesh(boxGeo()),
      cyl: mesh(cylGeo(18, 0.5, 0.5, true)),
      cone: mesh(cylGeo(18, 0.0, 0.5, true)),
      disc: mesh(discGeo(28)),
      quad: mesh(quadGeo()),
      prism: mesh(prismGeo()),
      mountain: mesh(cylGeo(28, 0.0, 0.5, false, true, 0.18)),
    };
    function texture(drawFn, w, h, repeat) {
      const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); drawFn(ctx, w, h);
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// ---------------- world state helpers ----------------
function seasonAt(t) {
  if (t < 6.0 || (t >= 0.8 && t < 1.4 && false)) return 0;
  if (t < 7.6) return smooth(6.0, 7.5, t) * 2.0;          // green -> autumn -> bare
  if (t < 9.2) return 3;                                  // snow
  return 4;                                               // future city
}
function dayAt(t) {
  // fast day/night strobe during time-lapse parts
  if (t < 0.8) return 0.75 + 0.25 * Math.cos(t * 14);
  if (t < 1.4) return 0.75 + 0.25 * Math.cos(t * 30);
  if (t >= 6.0 && t < 11.0) return 0.6 + 0.4 * Math.cos((t - 6.0) * 9);
  if (t >= 14.2 && t < 14.6) return 0.5 + 0.5 * Math.cos((t - 14.2) * 40);

}

function stuff(t) {

}

const SHOTS = [

  { t0: 0.8, w: 8, target: (t) => CLOSE },
  { t0: 1.4, snap: true, target: (t) => ({ pos: [CLOSE.pos[0], CLOSE.pos[1], CLOSE.pos[2] - 0.05 * (t - 1.4)], look: CLOSE.look, fov: CLOSE.fov }) },
  { t0: 3.4, w: 5, target: (t) => WIDE },
  { t0: 4.4, snap: true, target: (t) => ({ pos: [CLOSE.pos[0] + 0.03 * (t - 4.4), CLOSE.pos[1], CLOSE.pos[2] - 0.05 * (t - 4.4)], look: CLOSE.look, fov: CLOSE.fov }) },
  { t0: 6.0, w: 4, target: (t) => ({ pos: [WIDE.pos[0] - 0.08 * (t - 6), WIDE.pos[1] - 0.03 * (t - 6), WIDE.pos[2] - 0.12 * (t - 6)], look: WIDE.look, fov: WIDE.fov }) },
  { t0: 11.0, w: 6, target: (t) => MED },
  { t0: 12.9, w: 9, target: (t) => ({ pos: [-0.4, 2.1, 4.6], look: [0.08, 1.58, -0.2], fov: 38 }) },
  { t0: 13.95, w: 10, target: (t) => ({ pos: [-0.6, 2.2, 5.3], look: [0.02, 1.6, -0.3], fov: 40 }) },
  { t0: 16.6, w: 4, target: (t) => ({ pos: [0.0, 2.7, 4.6], look: [-1.0, 1.3, -1.2], fov: 50 }) },
];
function shakeAt(t) {
  let s = 0; for (const [a, amp] of [[0.8, 0.05], [3.45, 0.03], [3.7, 0.03], [3.95, 0.03], [4.4, 0.05], [9.2, 0.07], [11.0, 0.04], [14.1, 0.05], [14.6, 0.09]]) { const d = t - a; if (d >= 0 && d < 0.45) s = Math.max(s, amp * (1 - d / 0.45)); }
  if (t >= 9.2 && t < 10.9) s = Math.max(s, 0.02);
  return s ? [Math.sin(t * 71) * s, Math.cos(t * 53) * s, 0] : null;
}
function envAt(t) {
  const d = dayAt(t), k = lerp(0.55, 1.0, d);
  return { skyTop: [0.2, 0.22, 0.3], skyBot: [0.1, 0.1, 0.14], light: [0.5, 1.0, 0.75], fog: [0.95, 0.9, 0.85], amb: [0.95 * k, 0.93 * k, 0.9 * k], gnd: [0.55 * k, 0.48 * k, 0.42 * k], fogNear: 9, fogFar: 30 };
}

// ---------------- scene ----------------
let ZZ = [];
function scene(t) {
  const S = stuff(t);
  drawRoom(t, S);
  const H = drawHero(t, S);
  drawMom(t, S);
  const P = drawPhone(t);
  // pressing arm visible in phone scenes (closeups / press moments)
  const handOn = (t < 3.4) || (t >= 4.4 && t < 6.0) || (t >= 3.4 && t < 4.4) || (t >= 14.0 && t < 14.45);
  if (handOn) {
    const reach = t >= 14.0 ? [HX + 0.3, 1.42, 0.05] : null;
    const press = pressAmt(t);
    if (t < 14.0 || press > 0 || t < 14.3) drawHand(t, P, reach);
  }
  // snore bubbles 16.6+
  if (t >= 15.0 && t < 18.0) {
    for (let k = 0; k < 3; k++) { const u = ((t - 15.0) * 0.8 + k / 3) % 1; D(m.sphere, M4.chain(M4.T(HX + 0.2 + u * 0.5, 1.2 + u * 0.9, -1.0 + u * 0.1), M4.S(0.08 + u * 0.12)), '#dff3ff', { alpha: 0.8 * (1 - u), em: 0.5 }); }
  }
}

// ---------------- HUD ----------------
const SUBS = [
  [0.0, 1.95, '알람 5분만 더<br>눌렀거든.'],
  [2.15, 5.1, '근데 누를 때마다<br>자는 시간이 두 배야.'],
  [5.45, 6.97, '이틀이 두 달 되고,'],
  [9.25, 11.28, '결국 10년을 잤어.'],
  [11.5, 13.85, '겨우 깼는데<br>알람이 또 울려.'],
  // 14.15-15.9 "손이 먼저 눌렀어." — 같은 문구가 팝(14.1-16.4)으로 떠 있어 자막은 생략(중복 방지)
];
// [t0, t1, text, px, color]
const POPS = [
  [0.85, 1.38, '휘리릭', 36], [1.45, 2.12, '띠리리', 44], [2.2, 2.56, '딸깍', 44], [2.6, 2.97, '또 딸깍', 44, '#ffe14d'], [3.0, 3.38, '딸깍', 44],
  [3.45, 4.36, '쾅쾅', 48], [4.45, 5.95, '999+', 48, '#ff6b81'], [6.05, 7.5, '사르륵', 44], [7.65, 9.1, '쿨쿨', 44], [9.25, 10.9, '쿠구궁', 48],
  [11.05, 12.3, '번쩍', 48, '#ffe14d'], [12.95, 13.9, '띠리리', 44], [14.1, 16.45, '손이 먼저 눌렀어', 40, '#ffe14d'], [16.7, 17.9, '하아…', 44],
];
const ENDT = 18.0;
let popKey = '';
function hud(t) {
  const s = SUBS.find(([a, b]) => t >= a && t < b);
  $('sub').innerHTML = s ? s[2] : '';
  $('subRow').style.opacity = s && t < ENDT ? 1 : 0;
  // counter
  const C = $('counter'), v = counterAt(t);
  if (v === null || t >= ENDT) { $('counterRow').style.opacity = 0; }
  else {
    $('counterRow').style.opacity = 1;
    C.querySelector('.num').innerHTML = v.toLocaleString('en-US') + '<small>분</small>';
    fitText(C.querySelector('.num'), 48, 290, 30);
    C.querySelector('.sub').textContent = t < 0.8 ? '이틀째' : (t < 1.3 ? '되감는 중' : subFor(v));
    let lc = -9; for (let tt = t; tt > t - 0.3; tt -= 1 / 60) { const w = counterAt(tt); if (w !== v) { lc = tt; break; } }
    let sc = 1 + 0.16 * Math.exp(-(t - lc) * 12);
    if (t >= 14.6 && t < 15.2) sc = 1 + 0.22 * Math.exp(-(t - 14.6) * 7);
    if (t < 0.8) sc = 1.0 + 0.03 * Math.sin(t * 40);
    C.style.transform = `scale(${sc.toFixed(3)})`;
  }
  // pop (scale/translateY only on inner element)
  const P = $('pop'), p = POPS.find(([a, b]) => t >= a && t < b);
  if (p && t < ENDT) {
    const u = (t - p[0]) / (p[1] - p[0]); const sc = easeOutBack(Math.min(1, u * 4));
    const key = p[2] + p[3];
    if (key !== popKey) { P.textContent = p[2]; fitText(P, p[3], 300, 24); popKey = key; }
    P.style.color = p[4] || '#fff';
    P.style.transform = `translateY(${(-8 * Math.min(1, u * 3)).toFixed(1)}px) scale(${Math.max(0.01, sc).toFixed(3)})`;
    $('popRow').style.opacity = u > 0.85 ? (1 - (u - 0.85) / 0.15).toFixed(3) : 1;
  } else { $('popRow').style.opacity = 0; }
  // rewind overlay
  const rw = t >= 0.8 && t < 1.4;
  $('rew').style.opacity = rw ? 0.9 : 0;
  const cv = $('c');
  cv.style.filter = rw ? 'saturate(0.5) contrast(1.15) blur(1.2px)' : (t >= ENDT ? 'brightness(0.72) blur(2px)' : (t >= 14.2 && t < 14.6 ? 'saturate(1.4) contrast(1.1)' : 'none'));
  // flashes
  let fl = 0; for (const [ft, a] of [[0.8, 0.5], [1.38, 0.35], [6.0, 0.25], [9.2, 0.45], [11.0, 0.7], [14.6, 0.5]]) { const d = t - ft; if (d >= 0 && d < 0.3) fl = Math.max(fl, a * (1 - d / 0.3)); }
  $('flash').style.opacity = fl.toFixed(3);
  // end card
  const ec = smooth(ENDT, ENDT + 0.25, t);
  $('endRow').style.opacity = ec.toFixed(3);
  $('end').style.transform = `scale(${(0.85 + 0.15 * easeOutBack((t - ENDT) / 0.35)).toFixed(3)})`;
  $('titleRow').style.opacity = (1 - ec * 0.65).toFixed(3); $('badgeRow').style.opacity = (1 - ec * 0.65).toFixed(3);
}

window.DURATION = DURATION;
window.renderAt = function (t) {
  const cam = springCamera(SHOTS, t, shakeAt(t));
  E.begin(cam, envAt(t));
  scene(t);
  E.end();
  hud(t);
  return true;
};
window.renderAt(0);
</script>
