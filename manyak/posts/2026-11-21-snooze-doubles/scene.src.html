<script>
'use strict';
const { M4, rng, clamp, lerp, smooth, easeOutBack, springCamera, drawCharacter, basis, fitText } = ME;
const E = MiniEngine(document.getElementById('c'));
const gl = E.gl;
const m = E.meshes, D = E.draw;
const DURATION = 19.5;
const FONT = "'Noto Sans CJK KR','Noto Sans KR',sans-serif";
const $ = (id) => document.getElementById(id);
const pulse = (t, a, w) => { const d = t - a; return d >= 0 && d < w ? Math.sin(d / w * Math.PI) : 0; };

// ---------------- timeline facts ----------------
// presses (hand pushes button) — 출발 행동 1.7초, 반전 14.1초
const PRESSES = [0.0, 0.5, 1.75, 2.3, 2.7, 3.1, 3.55, 3.8, 4.05, 4.3, 4.75, 5.2, 14.6];
const PRESS_T = 14.6; // 반전: 손이 혼자 누름 (14.0~14.6 뻗음, 15.5까지 누른 채)
// ringing windows [t0, t1]
const RINGS = [[0, 0.8], [1.4, 1.7], [2.2, 2.3], [2.6, 2.7], [3.0, 3.1], [3.4, 3.55], [3.65, 3.8], [3.9, 4.05], [4.15, 4.3], [4.4, 5.5], [9.2, 9.8], [11.0, 14.6]];
const ringing = (t) => RINGS.some(([a, b]) => t >= a && t < b);
function pressAmt(t) { let p = 0; for (const s of PRESSES) { const d = t - s; if (d >= -0.12 && d < 0.18) p = Math.max(p, d < 0 ? 1 + d / 0.12 : 1 - d / 0.18); } if (t >= PRESS_T && t < 15.5) p = 1; return clamp(p, 0, 1); }
// phone clock text (only 1.4–3.4)
function phoneTime(t) {
  if (t < 1.4 || t >= 3.4) return '';
  if (t < 2.2) return '07:00'; if (t < 2.6) return '07:05'; if (t < 3.0) return '07:10'; return '07:20';
}

// ---------------- counter (누적 더 잔 시간 = 5 x 2^(k-1) 분) ----------------
const STEPS = [[2.2, 5], [2.6, 10], [3.0, 20], [3.4, 40], [3.65, 80], [3.9, 160], [4.15, 320]];
const ROLLS = [[4.4, 4.62, 320, 2560], [5.5, 5.85, 2560, 81920], [7.6, 7.95, 81920, 655360], [9.2, 9.55, 655360, 5242880], [14.7, 14.72, 5242880, 10485760]];
function snap2(v) { const k = Math.round(Math.log2(v / 5)); return 5 * Math.pow(2, Math.max(0, k)); }
function counterAt(t) {
  if (t < 0.8) return 2560;
  if (t < 1.3) return snap2(2560 * Math.pow(5 / 2560, smooth(0.8, 1.3, t)));
  if (t < 2.2) return null;
  let v = 5; for (const [a, val] of STEPS) if (t >= a) v = val;
  for (const [a, b, v0, v1] of ROLLS) { if (t >= b) v = v1; else if (t >= a) v = snap2(v0 * Math.pow(v1 / v0, (t - a) / (b - a))); }
  return v;
}
function subFor(v) {
  const T = { 5: '누를 때마다 2배', 10: '누를 때마다 2배', 20: '누를 때마다 2배', 40: '누를 때마다 2배', 80: '누를 때마다 2배', 160: '누를 때마다 2배', 320: '누를 때마다 2배', 640: '10시간 넘게', 1280: '하루 가까이', 2560: '이틀째', 5120: '나흘째', 10240: '1주일 넘게', 20480: '2주 넘게', 40960: '약 4주', 81920: '약 2달', 163840: '약 4달', 327680: '7달 넘게', 655360: '1년 넘게', 1310720: '약 2.5년', 2621440: '약 5년', 5242880: '약 10년', 10485760: '약 20년' };
  return T[v] || '';
}

// ---------------- screen texture (phone) ----------------
const phoneCanvas = document.createElement('canvas'); phoneCanvas.width = 256; phoneCanvas.height = 512;
const phoneTex = E.texture((c, w, h) => { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); }, 256, 512);
let phoneKey = '';
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function updatePhone(time, pressed, badge, ring, glow) {
  const key = [time, pressed ? 1 : 0, badge ? 1 : 0, ring ? Math.round(glow * 4) : -1].join('|');
  if (key === phoneKey) return; phoneKey = key;
  const c = phoneCanvas.getContext('2d'), w = 256, h = 512;
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, ring ? '#3b3f8f' : '#1d2040'); g.addColorStop(1, ring ? '#a24b7c' : '#2a1d3a');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // bell icon (shape only)
  c.save(); c.translate(w / 2, 52); c.scale(0.8, 0.8); const bs = ring ? 1 + glow * 0.12 : 1; c.scale(bs, bs);
  c.fillStyle = '#ffe14d'; c.beginPath(); c.moveTo(-34, 26); c.quadraticCurveTo(-30, -36, 0, -40); c.quadraticCurveTo(30, -36, 34, 26); c.closePath(); c.fill();
  c.fillRect(-42, 22, 84, 10); c.beginPath(); c.arc(0, 38, 9, 0, 7); c.fill();
  if (ring) { c.strokeStyle = '#ffe14d'; c.lineWidth = 6; for (const s of [-1, 1]) { c.beginPath(); c.arc(0, 0, 54, s < 0 ? Math.PI * 0.8 : -Math.PI * 0.2, s < 0 ? Math.PI * 1.2 : Math.PI * 0.2); c.stroke(); } }
  c.restore();
  if (time) { c.fillStyle = '#fff'; c.font = `900 66px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(time, w / 2, 135); }
  // snooze button
  const by = pressed ? 196 : 190;
  if (!pressed) { c.fillStyle = 'rgba(0,0,0,.45)'; rr(c, 22, 200, w - 44, 104, 30); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.18)'; rr(c, 90, 470, 76, 8, 4); c.fill();
  c.fillStyle = pressed ? '#d9822b' : '#ff9f1c'; rr(c, 22, by, w - 44, 100, 30); c.fill();
  c.fillStyle = '#fff'; c.font = `900 46px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('5분만 더', w / 2, by + 52);
  if (badge) { c.fillStyle = '#ff2d3f'; c.beginPath(); c.arc(w - 34, 34, 26, 0, 7); c.fill(); c.fillStyle = '#fff'; for (let k = -1; k <= 1; k++) { c.beginPath(); c.arc(w - 34 + k * 11, 34, 4.5, 0, 7); c.fill(); } }
  gl.bindTexture(gl.TEXTURE_2D, phoneTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, phoneCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
}

// ---------------- window scenery texture ----------------
const winCanvas = document.createElement('canvas'); winCanvas.width = 256; winCanvas.height = 256;
const winTex = E.texture((c, w, h) => { c.fillStyle = '#9fd3ff'; c.fillRect(0, 0, w, h); }, 256, 256);
let winKey = '';
function mixc(a, b, u) { const A = E.hex(a), B = E.hex(b); return `rgb(${A.map((x, i) => Math.round(255 * lerp(x, B[i], u))).join(',')})`; }
function updateWindow(season, day, t) {
  const fut = season >= 4;
  const key = fut ? 'f' + Math.round(t * 30) + '|' + Math.round(day * 8) : season.toFixed(2) + '|' + Math.round(day * 8);
  if (key === winKey) return; winKey = key;
  const c = winCanvas.getContext('2d'), w = 256, h = 256;
  const sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, mixc('#18204a', season >= 3 && season < 4 ? '#c9d8e8' : '#6fc3ff', day)); sky.addColorStop(1, mixc('#2a2f60', season >= 3 && season < 4 ? '#eef3f8' : '#d4f0ff', day));
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  if (day < 0.4) { const R = rng(3); c.fillStyle = 'rgba(255,255,255,' + (0.4 - day) * 2.2 + ')'; for (let i = 0; i < 30; i++) c.fillRect(R() * w, R() * h * 0.6, 2.5, 2.5); c.fillStyle = '#fff6c8'; c.beginPath(); c.arc(196, 52, 22, 0, 7); c.fill(); c.fillStyle = mixc('#18204a', '#6fc3ff', day); c.beginPath(); c.arc(184, 46, 20, 0, 7); c.fill(); }
  if (!fut) {
    c.fillStyle = mixc('#20301e', season >= 3 ? '#f4f7fb' : '#7cc46a', day); c.fillRect(0, 196, w, 60);
    c.fillStyle = '#6b4a2f'; c.fillRect(112, 110, 30, 96);
    c.strokeStyle = '#6b4a2f'; c.lineWidth = 9; c.beginPath(); c.moveTo(127, 140); c.lineTo(80, 96); c.moveTo(127, 128); c.lineTo(176, 88); c.stroke();
    let leaf = null, amt = 1;
    if (season < 1) leaf = mixc('#3fae4a', '#f08a24', season);
    else if (season < 2) { leaf = mixc('#f08a24', '#c0502a', season - 1); amt = 1 - (season - 1); }
    else amt = 0;
    if (leaf && amt > 0.02) {
      c.fillStyle = leaf; c.globalAlpha = Math.min(1, amt * 1.4);
      for (const [x, y, r] of [[128, 80, 56], [86, 96, 38], [172, 92, 40], [110, 52, 34], [150, 56, 34]]) { c.beginPath(); c.arc(x, y, r * (0.6 + 0.4 * amt), 0, 7); c.fill(); }
      c.globalAlpha = 1;
    }
    if (season >= 1.3 && season < 2.2) { c.fillStyle = '#e0702a'; const R = rng(5); for (let i = 0; i < 14; i++) { c.fillRect(R() * w, 150 + R() * 60, 7, 5); } }
    if (season >= 2.6) { c.fillStyle = '#ffffff'; const R = rng(9); for (let i = 0; i < 40; i++) { const y = (R() * h + t * 60 * (0.5 + R())) % h; c.beginPath(); c.arc(R() * w, y, 2.6, 0, 7); c.fill(); }
      c.fillStyle = '#f4f7fb'; c.fillRect(84, 84, 90, 10); }
  } else {
    // future city: towers + flying cars
    const R = rng(12);
    for (let i = 0; i < 9; i++) {
      const x = i * 30 - 6 + R() * 8, bw = 22 + R() * 16, bh = 90 + R() * 130;
      c.fillStyle = mixc('#1b2036', '#7d8fb8', day); c.fillRect(x, h - bh, bw, bh);
      c.fillStyle = day > 0.5 ? '#bfe6ff' : '#ffd86b';
      for (let yy = h - bh + 8; yy < h - 6; yy += 14) for (let xx = x + 4; xx < x + bw - 5; xx += 9) if (R() < 0.55) c.fillRect(xx, yy, 5, 7);
      c.fillStyle = '#5cf2ff'; c.fillRect(x + bw / 2 - 1, h - bh - 14, 2, 14);
    }
    for (let k = 0; k < 5; k++) {
      const sp = 70 + k * 23, y = 40 + k * 30, x = ((t * sp + k * 97) % (w + 80)) - 40;
      c.fillStyle = ['#ff6b81', '#ffe14d', '#5cf2ff', '#b46cff', '#2fbf71'][k];
      rr(c, x, y, 34, 12, 6); c.fill(); c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(x + 20, y + 2, 8, 5);
    }
  }
  gl.bindTexture(gl.TEXTURE_2D, winTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, winCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
}
const TX = {
  floor: E.texture((c, w, h) => { c.fillStyle = '#c89a6a'; c.fillRect(0, 0, w, h); c.fillStyle = '#b6875a'; for (let i = 0; i < 8; i++) c.fillRect(0, i * 32, w, 3); }, 256, 256, true),
  wall: E.texture((c, w, h) => { c.fillStyle = '#f6e7d2'; c.fillRect(0, 0, w, h); c.fillStyle = '#efdcc2'; for (let i = 0; i < 16; i++) c.fillRect(i * 16, 0, 6, h); }, 256, 256, true),
  duvet: E.texture((c, w, h) => { c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h); c.fillStyle = '#d8e8ff'; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2) c.fillRect(x * 32, y * 32, 32, 32); c.fillStyle = '#ffd1dc'; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { c.beginPath(); c.arc(x * 32 + 16, y * 32 + 16, 5, 0, 7); c.fill(); } }, 256, 256, true),
};

// ---------------- world state helpers ----------------
function seasonAt(t) {
  if (t < 5.5) return 0;
  if (t < 7.6) return smooth(5.5, 7.3, t) * 2.0;          // green -> autumn -> bare
  if (t < 9.2) return 3;                                  // snow
  return 4;                                               // future city
}
function dayAt(t) {
  // 0~0.8, 4.4~5.5 = 이틀째 새벽 01:40 (밤) / 1.4~4.4 아침 / 타임랩스 구간은 낮밤 깜빡
  if (t < 0.8) return 0.04;
  if (t < 1.4) return 0.5 + 0.5 * Math.cos((t - 0.8) * 26 + Math.PI) * (1 - smooth(1.2, 1.4, t)) + 0.5 * smooth(1.2, 1.4, t) ;
  if (t < 4.4) return 1;
  if (t < 5.5) return 0.04;
  if (t < 11.0) return 0.55 + 0.45 * Math.cos((t - 5.5) * 9);
  if (t >= 15.5 && t < 15.9) return 0.5 + 0.5 * Math.cos((t - 15.5) * 40);
  if (t >= 16.0) return 0.25;
  return 0.8;
}
// 상태 (콜드 오픈 0~0.8 = 이틀째 중간 장면이지만 상자·우유팩은 4.4초에 처음 등장)
function stuff(t) {
  return {
    boxes: t < 4.4 ? 0 : t < 5.5 ? 3 : t < 7.6 ? 6 : 10,
    web: smooth(5.8, 6.8, t),
    hair: t < 5.5 ? 0 : t < 7.6 ? smooth(5.5, 7.4, t) : 1 + smooth(7.6, 9.0, t),
    dust: smooth(7.6, 9.0, t),
    vine: smooth(9.2, 10.4, t),
    beard: smooth(9.3, 9.9, t),
    ladleDropped: t >= 4.4 ? smooth(4.5, 4.75, t) : (t < 0.8 ? 0.15 + 0.25 * smooth(0.0, 0.8, t) : 0),
  };
}

// ---------------- props ----------------
const HX = -0.85; // hero lies on the left half of the bed
const PHONE0 = [0.5, 1.47, 0.9];
const PHONE_SIT = [0.6, 1.35, 0.9];
let PHONE = PHONE0;
function phoneMat(t) {
  PHONE = t >= 11.0 ? PHONE_SIT : PHONE0;
  const vib = ringing(t) ? Math.sin(t * 95) * 0.07 + Math.sin(t * 61) * 0.03 : 0;
  return M4.chain(M4.T(PHONE[0] + (ringing(t) ? Math.sin(t * 83) * 0.015 : 0), PHONE[1], PHONE[2]), M4.RY(-0.08), M4.RX(-0.3), M4.RZ(vib));
}
function drawPhone(t) {
  const P = phoneMat(t);
  const press = pressAmt(t);
  D(m.box, M4.chain(P, M4.S(0.5, 0.92, 0.07)), '#25262e', { spec: 0.7 });
  updatePhone(phoneTime(t), press > 0.3, t >= 4.4 && t < 5.5, ringing(t), 0.5 + 0.5 * Math.sin(t * 30));
  D(m.quad, M4.chain(P, M4.T(0, 0, 0.0365), M4.S(0.44, 0.84, 1)), [1, 1, 1], { tex: phoneTex, em: 0.92, spec: 0.3 });
  return P;
}
// 손: 소매(분홍) + 흰 소맷부리 + 손바닥 + 검지(위로) + 엄지. 검지 끝이 '5분만 더' 버튼 아래 테두리만 누름(글자 안 가림)
const v3 = { add: (a, b) => a.map((x, k) => x + b[k]), sub: (a, b) => a.map((x, k) => x - b[k]), mul: (a, s) => a.map((x) => x * s), len: (a) => Math.hypot(a[0], a[1], a[2]), lerp: (a, b, u) => a.map((x, k) => x + (b[k] - x) * u) };
function limb(a, b, r, col) { const d = v3.sub(b, a), L = v3.len(d); D(m.cyl, M4.mul(basis(v3.lerp(a, b, 0.5), d, [0, 0, 1], 1), M4.S(r, L, r)), col, { spec: 0.4 }); }
function drawHand(t, P, from, reachU) {
  const press = pressAmt(t);
  // button bottom edge in phone-local coords: (x, -0.06, front)
  let tip = M4.apply(P, [0.06, -0.085 + 0.012 * press, 0.045 + 0.07 * (1 - press)]);
  if (reachU !== undefined) tip = v3.lerp(from, tip, reachU);
  const up = M4.apply(P, [0.0, 1, 0]).map((x, k) => x - M4.apply(P, [0, 0, 0])[k]);
  const fingerBase = v3.add(tip, v3.mul(up, -0.13));
  const palm = v3.add(fingerBase, [0.05, -0.1, 0.06]);
  const wrist = v3.add(palm, v3.mul(v3.sub(from, palm), 0.12 / v3.len(v3.sub(from, palm))));
  limb(from, wrist, 0.17, '#ff6b81');
  D(m.cyl, M4.mul(basis(wrist, v3.sub(wrist, from), [0, 0, 1], 1), M4.S(0.19, 0.05, 0.19)), '#ffffff', { spec: 0.2 });
  D(m.sphere, M4.mul(basis(palm, v3.sub(palm, from), [0, 0, 1], 1), M4.S(0.2, 0.17, 0.12)), '#f3cdb8', { spec: 0.3 });
  limb(fingerBase, tip, 0.055, '#f3cdb8');
  D(m.sphere, M4.chain(M4.T(tip[0], tip[1], tip[2]), M4.S(0.058)), '#f3cdb8', { spec: 0.3 });
  for (const k of [1, 2]) D(m.sphere, M4.chain(M4.T(palm[0] - 0.03 * k + 0.02, palm[1] + 0.06, palm[2] + 0.05), M4.S(0.07, 0.06, 0.07)), '#ecc0a8', { spec: 0.3 });
  const th = v3.add(palm, [-0.1, 0.04, 0.03]); D(m.sphere, M4.chain(M4.T(th[0], th[1], th[2]), M4.S(0.06, 0.09, 0.06)), '#f3cdb8', { spec: 0.3 });
}
function shadow(x, y, z, r, a) { D(m.disc, M4.chain(M4.T(x, y + 0.01, z), M4.RX(-Math.PI / 2), M4.S(r)), [0, 0, 0], { alpha: a === undefined ? 0.25 : a, spec: 0, em: 1 }); }
function withAlpha(a, fn) { if (a >= 0.999) return fn(); const D0 = E.draw; E.draw = (mm, mat, c, o) => D0(mm, mat, c, Object.assign({}, o || {}, { alpha: a * (o && o.alpha !== undefined ? o.alpha : 1) })); try { fn(); } finally { E.draw = D0; } }

function drawRoom(t, S) {
  const day = dayAt(t);
  D(m.box, M4.chain(M4.T(0, -0.05, 9), M4.S(7, 0.1, 26)), '#ffffff', { tex: TX.floor, tr: [3, 10], spec: 0.15 });
  D(m.box, M4.chain(M4.T(0, 2.0, -2.3), M4.S(7, 4.2, 0.1)), '#ffffff', { tex: TX.wall, tr: [3, 2], spec: 0.05 });
  D(m.box, M4.chain(M4.T(-2.8, 2.0, 9), M4.S(0.1, 4.2, 26)), '#ffffff', { tex: TX.wall, tr: [10, 2], spec: 0.05 });
  D(m.box, M4.chain(M4.T(2.8, 2.0, 9), M4.S(0.1, 4.2, 26)), '#ffffff', { tex: TX.wall, tr: [10, 2], spec: 0.05 });
  // window (back wall, right)
  updateWindow(seasonAt(t) + (t >= 14.2 && t < 14.6 ? 0 : 0), day, t);
  D(m.quad, M4.chain(M4.T(1.25, 2.05, -2.24), M4.S(1.5, 1.3, 1)), [1, 1, 1], { tex: winTex, em: 0.95, spec: 0 });

const ENDT = 18.0;

    P.style.color = p[4] || '#fff';
    P.style.transform = `translateY(${(-8 * Math.min(1, u * 3)).toFixed(1)}px) scale(${Math.max(0.01, sc).toFixed(3)})`;

  } else { $('popRow').style.opacity = 0; }

  cv.style.filter = rw ? 'saturate(0.5) contrast(1.15) blur(1.2px)' : (t >= ENDT ? 'brightness(0.72) blur(2px)' : (t >= 15.5 && t < 15.9 ? 'saturate(1.4) contrast(1.1)' : 'none'));
  // flashes
  let fl = 0; for (const [ft, a] of [[0.8, 0.5], [1.38, 0.35], [5.5, 0.25], [9.2, 0.45], [11.0, 0.7], [14.7, 0.5]]) { const d = t - ft; if (d >= 0 && d < 0.3) fl = Math.max(fl, a * (1 - d / 0.3)); }
  $('flash').style.opacity = fl.toFixed(3);
  // end card
  const ec = smooth(ENDT, ENDT + 0.25, t);
  $('endRow').style.opacity = ec.toFixed(3);
  $('end').style.transform = `scale(${(0.85 + 0.15 * easeOutBack((t - ENDT) / 0.35)).toFixed(3)})`;
  $('titleRow').style.opacity = (1 - ec * 0.65).toFixed(3);
  // 배지: 0~1.4초(콜드 오픈) 숨김(0초 글자 줄이기), 엔딩 카드 동안 숨김(EP 표기 중복 방지)
  $('badgeRow').style.opacity = t < 1.4 ? 0 : (1 - ec).toFixed(3);
}

window.DURATION = DURATION;
// 디버그: 월드 좌표 -> CSS 화면 좌표
window.proj = (p) => { const v = window.__vp; const x = v[0] * p[0] + v[4] * p[1] + v[8] * p[2] + v[12], y = v[1] * p[0] + v[5] * p[1] + v[9] * p[2] + v[13], w = v[3] * p[0] + v[7] * p[1] + v[11] * p[2] + v[15]; return [+((x / w * 0.5 + 0.5) * 540).toFixed(0), +((0.5 - y / w * 0.5) * 960).toFixed(0)]; };
window.keyPts = (t) => { const P = phoneMat(t); const st = heroState(t); const hb = heroBase(st.lie).base; const head = M4.apply(hb, [0, 1.48, 0]);
  return { phoneTL: proj(M4.apply(P, [-0.25, 0.46, 0])), phoneBR: proj(M4.apply(P, [0.25, -0.46, 0])), btn: proj(M4.apply(P, [0, -0.06, 0])), head: proj(head), headTop: proj([head[0], head[1] + 0.48, head[2]]), headL: proj([head[0] - 0.45, head[1], head[2]]), mom: proj([-1.6, 1.6, -1.65]) }; };
window.renderAt = function (t) {
  const cam = window.CAM_OVERRIDE || springCamera(SHOTS, t, shakeAt(t));
  E.begin(cam, envAt(t));
  scene(t);
  window.__vp = E.end();
  hud(t);
  return true;
};
window.renderAt(0);
