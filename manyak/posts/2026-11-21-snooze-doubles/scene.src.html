<script>
'use strict';
const { M4, rng, clamp, lerp, smooth, easeOutBack, springCamera, drawCharacter, basis, fitText } = ME;
const E = MiniEngine(document.getElementById('c'));
const gl = E.gl;
const m = E.meshes, D = E.draw;
const DURATION = 19.5;
const FONT = "'Noto Sans CJK KR','Noto Sans KR',sans-serif";
const $ = (id) => document.getElementById(id);
const pulse = (t, a, w) => { const d = t - a; return d >= 0 && d < w ? Math.sin(d / w * Math.PI) : 0; };

// ---------------- timeline facts ----------------
// presses (hand pushes button) — 출발 행동 1.7초, 반전 14.1초
const PRESSES = [0.0, 1.7, 2.3, 2.7, 3.1, 3.55, 3.8, 4.05, 4.3, 4.75, 5.5, 14.1];
// ringing windows [t0, t1]
const RINGS = [[0, 0.8], [1.4, 1.7], [2.2, 2.3], [2.6, 2.7], [3.0, 3.1], [3.4, 3.55], [3.65, 3.8], [3.9, 4.05], [4.15, 4.3], [4.4, 6.0], [9.2, 9.8], [11.0, 14.1]];
const ringing = (t) => RINGS.some(([a, b]) => t >= a && t < b);
function pressAmt(t) { let p = 0; for (const s of PRESSES) { const d = t - s; if (d >= -0.12 && d < 0.18) p = Math.max(p, d < 0 ? 1 + d / 0.12 : 1 - d / 0.18); } if (t < 0.12) p = 1 - t / 0.5; return clamp(p, 0, 1); }
// phone clock text (only 1.4–3.4)
function phoneTime(t) {
  if (t < 1.4 || t >= 3.4) return '';
  if (t < 2.2) return '07:00'; if (t < 2.6) return '07:05'; if (t < 3.0) return '07:10'; return '07:20';
}

// ---------------- counter (누적 더 잔 시간 = 5 x 2^(k-1) 분) ----------------
const STEPS = [[2.2, 5], [2.6, 10], [3.0, 20], [3.4, 40], [3.65, 80], [3.9, 160], [4.15, 320]];
const ROLLS = [[4.4, 4.62, 320, 2560], [6.0, 6.35, 2560, 81920], [7.6, 7.95, 81920, 655360], [9.2, 9.55, 655360, 5242880], [14.6, 14.62, 5242880, 10485760]];
function snap2(v) { const k = Math.round(Math.log2(v / 5)); return 5 * Math.pow(2, Math.max(0, k)); }
function counterAt(t) {
  if (t < 0.8) return 2560;
  if (t < 1.3) return snap2(2560 * Math.pow(5 / 2560, smooth(0.8, 1.3, t)));
  if (t < 2.2) return null;
  let v = 5; for (const [a, val] of STEPS) if (t >= a) v = val;
  for (const [a, b, v0, v1] of ROLLS) { if (t >= b) v = v1; else if (t >= a) v = snap2(v0 * Math.pow(v1 / v0, (t - a) / (b - a))); }
  return v;
}
function subFor(v) {
  const T = { 5: '누를 때마다 2배', 10: '누를 때마다 2배', 20: '누를 때마다 2배', 40: '누를 때마다 2배', 80: '누를 때마다 2배', 160: '누를 때마다 2배', 320: '누를 때마다 2배', 640: '10시간 넘게', 1280: '하루 가까이', 2560: '이틀째', 5120: '사흘째', 10240: '1주일째', 20480: '2주째', 40960: '약 4주', 81920: '약 2달', 163840: '약 4달', 327680: '약 7달', 655360: '1년 넘게', 1310720: '약 2.5년', 2621440: '약 5년', 5242880: '약 10년', 10485760: '약 20년' };
  return T[v] || '';
}

// ---------------- screen texture (phone) ----------------
const phoneCanvas = document.createElement('canvas'); phoneCanvas.width = 256; phoneCanvas.height = 512;
const phoneTex = E.texture((c, w, h) => { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); }, 256, 512);
let phoneKey = '';
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function updatePhone(time, pressed, badge, ring, glow) {
  const key = [time, pressed ? 1 : 0, badge ? 1 : 0, ring ? Math.round(glow * 4) : -1].join('|');
  if (key === phoneKey) return; phoneKey = key;
  const c = phoneCanvas.getContext('2d'), w = 256, h = 512;
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, ring ? '#3b3f8f' : '#1d2040'); g.addColorStop(1, ring ? '#a24b7c' : '#2a1d3a');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // bell icon (shape only)
  c.save(); c.translate(w / 2, time ? 70 : 140); const bs = ring ? 1 + glow * 0.12 : 1; c.scale(bs, bs);
  c.fillStyle = '#ffe14d'; c.beginPath(); c.moveTo(-34, 26); c.quadraticCurveTo(-30, -36, 0, -40); c.quadraticCurveTo(30, -36, 34, 26); c.closePath(); c.fill();
  c.fillRect(-42, 22, 84, 10); c.beginPath(); c.arc(0, 38, 9, 0, 7); c.fill();
  if (ring) { c.strokeStyle = '#ffe14d'; c.lineWidth = 6; for (const s of [-1, 1]) { c.beginPath(); c.arc(0, 0, 54, s < 0 ? Math.PI * 0.8 : -Math.PI * 0.2, s < 0 ? Math.PI * 1.2 : Math.PI * 0.2); c.stroke(); } }
  c.restore();
  if (time) { c.fillStyle = '#fff'; c.font = `900 66px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(time, w / 2, 200); }
  // snooze button
  const by = pressed ? 336 : 330;
  if (!pressed) { c.fillStyle = 'rgba(0,0,0,.45)'; rr(c, 22, 340, w - 44, 104, 30); c.fill(); }
  c.fillStyle = pressed ? '#d9822b' : '#ff9f1c'; rr(c, 22, by, w - 44, 100, 30); c.fill();
  c.fillStyle = '#fff'; c.font = `900 46px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('5분만 더', w / 2, by + 52);
  if (badge) { c.fillStyle = '#ff2d3f'; c.beginPath(); c.arc(w - 34, 34, 26, 0, 7); c.fill(); c.fillStyle = '#fff'; for (let k = -1; k <= 1; k++) { c.beginPath(); c.arc(w - 34 + k * 11, 34, 4.5, 0, 7); c.fill(); } }
  gl.bindTexture(gl.TEXTURE_2D, phoneTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, phoneCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
}

// ---------------- window scenery texture ----------------
const winCanvas = document.createElement('canvas'); winCanvas.width = 256; winCanvas.height = 256;
const winTex = E.texture((c, w, h) => { c.fillStyle = '#9fd3ff'; c.fillRect(0, 0, w, h); }, 256, 256);
let winKey = '';
function mixc(a, b, u) { const A = E.hex(a), B = E.hex(b); return `rgb(${A.map((x, i) => Math.round(255 * lerp(x, B[i], u))).join(',')})`; }
function updateWindow(season, day, t) {
  const fut = season >= 4;
  const key = fut ? 'f' + Math.round(t * 30) + '|' + Math.round(day * 8) : season.toFixed(2) + '|' + Math.round(day * 8);
  if (key === winKey) return; winKey = key;
  const c = winCanvas.getContext('2d'), w = 256, h = 256;
  const sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, mixc('#18204a', season >= 3 && season < 4 ? '#c9d8e8' : '#6fc3ff', day)); sky.addColorStop(1, mixc('#2a2f60', season >= 3 && season < 4 ? '#eef3f8' : '#d4f0ff', day));
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  if (!fut) {
    c.fillStyle = mixc('#20301e', season >= 3 ? '#f4f7fb' : '#7cc46a', day); c.fillRect(0, 196, w, 60);
    c.fillStyle = '#6b4a2f'; c.fillRect(112, 110, 30, 96);
    c.strokeStyle = '#6b4a2f'; c.lineWidth = 9; c.beginPath(); c.moveTo(127, 140); c.lineTo(80, 96); c.moveTo(127, 128); c.lineTo(176, 88); c.stroke();
    let leaf = null, amt = 1;
    if (season < 1) leaf = mixc('#3fae4a', '#f08a24', season);
    else if (season < 2) { leaf = mixc('#f08a24', '#c0502a', season - 1); amt = 1 - (season - 1); }
    else amt = 0;
    if (leaf && amt > 0.02) {
      c.fillStyle = leaf; c.globalAlpha = Math.min(1, amt * 1.4);
      for (const [x, y, r] of [[128, 80, 56], [86, 96, 38], [172, 92, 40], [110, 52, 34], [150, 56, 34]]) { c.beginPath(); c.arc(x, y, r * (0.6 + 0.4 * amt), 0, 7); c.fill(); }
      c.globalAlpha = 1;
    }
    if (season >= 1.3 && season < 2.2) { c.fillStyle = '#e0702a'; const R = rng(5); for (let i = 0; i < 14; i++) { c.fillRect(R() * w, 150 + R() * 60, 7, 5); } }
    if (season >= 2.6) { c.fillStyle = '#ffffff'; const R = rng(9); for (let i = 0; i < 40; i++) { const y = (R() * h + t * 60 * (0.5 + R())) % h; c.beginPath(); c.arc(R() * w, y, 2.6, 0, 7); c.fill(); }
      c.fillStyle = '#f4f7fb'; c.fillRect(84, 84, 90, 10); }
  } else {
    // future city: towers + flying cars
    const R = rng(12);
    for (let i = 0; i < 9; i++) {
      const x = i * 30 - 6 + R() * 8, bw = 22 + R() * 16, bh = 90 + R() * 130;
      c.fillStyle = mixc('#1b2036', '#7d8fb8', day); c.fillRect(x, h - bh, bw, bh);
      c.fillStyle = day > 0.5 ? '#bfe6ff' : '#ffd86b';
      for (let yy = h - bh + 8; yy < h - 6; yy += 14) for (let xx = x + 4; xx < x + bw - 5; xx += 9) if (R() < 0.55) c.fillRect(xx, yy, 5, 7);
      c.fillStyle = '#5cf2ff'; c.fillRect(x + bw / 2 - 1, h - bh - 14, 2, 14);
    }
    for (let k = 0; k < 5; k++) {
      const sp = 70 + k * 23, y = 40 + k * 30, x = ((t * sp + k * 97) % (w + 80)) - 40;
      c.fillStyle = ['#ff6b81', '#ffe14d', '#5cf2ff', '#b46cff', '#2fbf71'][k];
      rr(c, x, y, 34, 12, 6); c.fill(); c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(x + 20, y + 2, 8, 5);
    }
  }
  gl.bindTexture(gl.TEXTURE_2D, winTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, winCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
}
const TX = {
  floor: E.texture((c, w, h) => { c.fillStyle = '#c89a6a'; c.fillRect(0, 0, w, h); c.fillStyle = '#b6875a'; for (let i = 0; i < 8; i++) c.fillRect(0, i * 32, w, 3); }, 256, 256, true),
  wall: E.texture((c, w, h) => { c.fillStyle = '#f6e7d2'; c.fillRect(0, 0, w, h); c.fillStyle = '#efdcc2'; for (let i = 0; i < 16; i++) c.fillRect(i * 16, 0, 6, h); }, 256, 256, true),
  duvet: E.texture((c, w, h) => { c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h); c.fillStyle = '#d8e8ff'; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2) c.fillRect(x * 32, y * 32, 32, 32); c.fillStyle = '#ffd1dc'; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { c.beginPath(); c.arc(x * 32 + 16, y * 32 + 16, 5, 0, 7); c.fill(); } }, 256, 256, true),
};

// ---------------- world state helpers ----------------
function seasonAt(t) {
  if (t < 6.0 || (t >= 0.8 && t < 1.4 && false)) return 0;
  if (t < 7.6) return smooth(6.0, 7.5, t) * 2.0;          // green -> autumn -> bare
  if (t < 9.2) return 3;                                  // snow
  return 4;                                               // future city
}
function dayAt(t) {
  // fast day/night strobe during time-lapse parts
  if (t < 0.8) return 0.75 + 0.25 * Math.cos(t * 14);
  if (t < 1.4) return 0.75 + 0.25 * Math.cos(t * 30);
  if (t >= 6.0 && t < 11.0) return 0.6 + 0.4 * Math.cos((t - 6.0) * 9);
  if (t >= 14.2 && t < 14.6) return 0.5 + 0.5 * Math.cos((t - 14.2) * 40);
  if (t >= 16.6) return 0.25;
  return 1;
}
// 상태 (콜드 오픈 0~0.8 = 이틀째 중간 장면이지만 상자·우유팩은 4.4초에 처음 등장)
function stuff(t) {
  const late = t >= 4.4;
  return {
    boxes: t < 4.4 ? 0 : t < 6.0 ? 3 : t < 7.6 ? 6 : 10,
    web: smooth(6.3, 7.2, t),
    hair: t < 6.0 ? 0 : t < 7.6 ? smooth(6.0, 7.4, t) : 1 + smooth(7.6, 9.0, t),
    dust: smooth(7.6, 9.0, t),
    vine: smooth(9.2, 10.4, t),
    beard: smooth(9.3, 9.9, t),
    momGrey: t >= 9.2 ? 1 : 0,
    ladleDropped: late ? smooth(4.45, 4.75, t) : (t < 0.8 ? smooth(0.0, 0.75, t) * 0.6 : 0),
  };
}

// ---------------- props ----------------
const HX = -0.22; // hero lies on the left half of the bed
const PHONE0 = [-0.02, 1.52, 0.62];
let PHONE = PHONE0;
function phoneMat(t) {
  PHONE = t >= 11.0 ? [0.3, 1.52, 0.62] : PHONE0;
  const vib = ringing(t) ? Math.sin(t * 95) * 0.035 : 0;
  return M4.chain(M4.T(PHONE[0], PHONE[1], PHONE[2]), M4.RY(-0.12), M4.RX(-0.32), M4.RZ(vib));
}
function drawPhone(t) {
  const P = phoneMat(t);
  const press = pressAmt(t);
  D(m.box, M4.chain(P, M4.S(0.47, 0.86, 0.07)), '#25262e', { spec: 0.7 });
  updatePhone(phoneTime(t), press > 0.3, t >= 4.4 && t < 6.0, ringing(t), 0.5 + 0.5 * Math.sin(t * 30));
  D(m.quad, M4.chain(P, M4.T(0, 0, 0.0365), M4.S(0.42, 0.79, 1)), [1, 1, 1], { tex: phoneTex, em: 0.92, spec: 0.3 });
  return P;
}
// hand from below (under duvet) to the bottom edge of the snooze button
function drawHand(t, P, reach) {
  const press = pressAmt(t);
  const tip = M4.apply(P, [0.02, -0.28 + 0.0, 0.05 + 0.06 * (1 - press) + 0.03]);
  const tipP = [tip[0], tip[1] - 0.03 - 0.03 * (1 - press), tip[2] + 0.02 + 0.05 * (1 - press)];
  const from = reach || [PHONE[0] + 0.12, 1.1, PHONE[2] + 0.75];
  const dir = [tipP[0] - from[0], tipP[1] - from[1], tipP[2] - from[2]], L = Math.hypot(...dir);
  const mid = from.map((v, k) => v + dir[k] * 0.5);
  D(m.cyl, M4.mul(basis(mid, dir, [0, 0, 1], 1), M4.S(0.17, L, 0.17)), '#ff6b81', { spec: 0.4 });
  D(m.sphere, M4.mul(basis(tipP, dir, [0, 0, 1], 1), M4.S(0.23, 0.25, 0.2)), '#f3cdb8', { spec: 0.3 });
  const f = tipP.map((v, k) => v + dir[k] / L * 0.09);
  D(m.sphere, M4.mul(basis(f, dir, [0, 0, 1], 1), M4.S(0.06, 0.12, 0.06)), '#f3cdb8', { spec: 0.3 });
}
function shadow(x, y, z, r, a) { D(m.disc, M4.chain(M4.T(x, y + 0.01, z), M4.RX(-Math.PI / 2), M4.S(r)), [0, 0, 0], { alpha: a === undefined ? 0.25 : a, spec: 0, em: 1 }); }
function withAlpha(a, fn) { if (a >= 0.999) return fn(); const D0 = E.draw; E.draw = (mm, mat, c, o) => D0(mm, mat, c, Object.assign({}, o || {}, { alpha: a * (o && o.alpha !== undefined ? o.alpha : 1) })); try { fn(); } finally { E.draw = D0; } }

function drawRoom(t, S) {
  const day = dayAt(t);
  D(m.box, M4.chain(M4.T(0, -0.05, 0), M4.S(7, 0.1, 8)), '#ffffff', { tex: TX.floor, tr: [3, 3], spec: 0.15 });
  D(m.box, M4.chain(M4.T(0, 2.0, -2.3), M4.S(7, 4.2, 0.1)), '#ffffff', { tex: TX.wall, tr: [3, 2], spec: 0.05 });
  D(m.box, M4.chain(M4.T(-2.8, 2.0, 0), M4.S(0.1, 4.2, 8)), '#ffffff', { tex: TX.wall, tr: [3, 2], spec: 0.05 });
  D(m.box, M4.chain(M4.T(2.8, 2.0, 0), M4.S(0.1, 4.2, 8)), '#ffffff', { tex: TX.wall, tr: [3, 2], spec: 0.05 });
  // window (back wall, right)
  updateWindow(seasonAt(t) + (t >= 14.2 && t < 14.6 ? 0 : 0), day, t);
  D(m.quad, M4.chain(M4.T(1.25, 2.05, -2.24), M4.S(1.5, 1.3, 1)), [1, 1, 1], { tex: winTex, em: 0.95, spec: 0 });
  for (const [x, y, sx, sy] of [[1.25, 2.73, 1.66, 0.09], [1.25, 1.37, 1.66, 0.09], [0.46, 2.05, 0.09, 1.42], [2.04, 2.05, 0.09, 1.42], [1.25, 2.05, 0.06, 1.3]]) D(m.box, M4.chain(M4.T(x, y, -2.2), M4.S(sx, sy, 0.08)), '#ffffff', { spec: 0.3 });
  // light patch on wall from window (day/night)
  D(m.quad, M4.chain(M4.T(-0.6, 2.4, -2.245), M4.S(1.6, 1.0, 1)), [1, 0.93, 0.7], { alpha: 0.1 + 0.18 * day, em: 1, spec: 0 });
  // door frame (back wall, left)
  D(m.box, M4.chain(M4.T(-1.9, 1.08, -2.24), M4.S(1.12, 2.2, 0.05)), '#8a5a3a', { spec: 0.2 });
  D(m.box, M4.chain(M4.T(-1.9, 1.05, -2.22), M4.S(0.96, 2.08, 0.05)), '#3a2a22', { spec: 0.1 });
  // bed
  D(m.box, M4.chain(M4.T(0, 0.27, 0), M4.S(2.5, 0.54, 3.1)), '#a8774f', { spec: 0.25 });
  D(m.box, M4.chain(M4.T(0, 0.9, -1.55), M4.S(2.5, 1.2, 0.12)), '#8d6040', { spec: 0.25 });
  D(m.box, M4.chain(M4.T(0, 0.6, 0), M4.S(2.36, 0.14, 2.96)), '#fbfbff', { spec: 0.1 });
  // pillow
  D(m.sphere, M4.chain(M4.T(HX, 0.72, -1.12), M4.S(1.05, 0.3, 0.62)), '#ffffff', { spec: 0.15 });
  // boxes & milk cartons (no text/logos)
  const R = rng(31);
  for (let i = 0; i < S.boxes; i++) {
    const milk = i % 3 === 1;
    const x = 1.65 + (i % 2) * 0.45 + (R() - 0.5) * 0.1, z = -0.9 + Math.floor(i / 2) * 0.48, y = 0;
    if (milk) { D(m.box, M4.chain(M4.T(x, 0.22, z), M4.RY(R()), M4.S(0.26, 0.44, 0.26)), '#ffffff', { spec: 0.3 }); D(m.box, M4.chain(M4.T(x, 0.36, z), M4.RY(R()), M4.S(0.27, 0.12, 0.27)), '#4f8cff', { spec: 0.3 }); }
    else { const s = 0.36 + R() * 0.12; D(m.box, M4.chain(M4.T(x, s / 2 + (i >= 6 ? 0.45 : 0), z), M4.RY(R() * 0.6), M4.S(s * 1.2, s, s)), '#c9945e', { spec: 0.1 }); D(m.box, M4.chain(M4.T(x, s + 0.003 + (i >= 6 ? 0.45 : 0), z), M4.RY(0), M4.S(s * 1.2 * 0.18, 0.006, s * 1.01)), '#e9d3a8', { spec: 0 }); }
  }
  // cobweb (top-left corner)
  if (S.web > 0.01) {
    for (let k = 0; k < 6; k++) { const a = -Math.PI / 2 + k * 0.3; const L = 0.9 * S.web; D(m.box, M4.chain(M4.T(-2.74, 3.9, -2.24), M4.RZ(a), M4.T(0, -L / 2, 0), M4.S(0.012, L, 0.012)), '#ffffff', { alpha: 0.6, em: 0.5 }); }
    for (let r = 1; r <= 3; r++) D(m.cyl, M4.chain(M4.T(-2.74, 3.9, -2.24), M4.RX(Math.PI / 2), M4.S(0.5 * r * S.web, 0.01, 0.5 * r * S.web)), '#ffffff', { alpha: 0.25, em: 0.5 });
  }
  // vines
  if (S.vine > 0.01) {
    const VR = rng(44);
    for (let k = 0; k < 9; k++) {
      const x = -2.6 + k * 0.62, len = (1.2 + VR() * 1.6) * S.vine;
      D(m.cyl, M4.chain(M4.T(x, 4.1 - len / 2, -2.2), M4.RZ((VR() - 0.5) * 0.3), M4.S(0.05, len, 0.05)), '#2f8f3a', { spec: 0.2 });
      for (let j = 0; j < 4; j++) if (j / 4 < S.vine) D(m.sphere, M4.chain(M4.T(x + (j % 2 ? 0.09 : -0.09), 4.0 - len * (j + 0.5) / 4, -2.17), M4.S(0.16, 0.1, 0.05)), '#3fae4a', { spec: 0.2 });
    }
    for (let k = 0; k < 4; k++) D(m.cyl, M4.chain(M4.T(-1.25 + k * 0.32, 0.62, 1.52), M4.RZ(1.3), M4.S(0.05, 0.5 * S.vine, 0.05)), '#2f8f3a', { spec: 0.2 });
  }
}

// hero pose: lie = 1 lying, 0 sitting
function heroBase(lie) {
  const a = -Math.PI / 2 * lie;
  const hip = [HX, lerp(0.62, 0.85, lie), lerp(-0.25, -0.08, lie)];
  return { base: M4.chain(M4.T(hip[0], hip[1], hip[2]), M4.RX(a), M4.T(0, -0.46, 0)), sit: 1 - lie };
}
function heroState(t) {
  // lying -> sit up (11.0-11.45) -> fall back (14.3-14.6)
  let lie = 1;
  if (t >= 11.0 && t < 14.3) lie = 1 - smooth(11.0, 11.45, t);
  else if (t >= 14.3 && t < 14.6) lie = smooth(14.3, 14.6, t);
  const o = { shirt: '#ff6b81', hair: 'bob', blink: 1, mouth: 0.12 + 0.08 * Math.sin(t * 5), eyeDots: 0, surprise: 0, headPitch: 0, headYaw: 0, browTilt: 0 };
  if (lie > 0.5) { o.headPitch = 0.55; o.headYaw = 0.25; }
  if (t >= 11.0 && t < 14.3) {
    o.blink = 0; o.surprise = t < 12.4 ? 1 : 0.6; o.mouth = t < 12.4 ? 0.9 + 0.1 * Math.sin(t * 20) : 0.35; o.eyeDots = t >= 12.4 && t < 13.95 ? 0.7 : 0;
    o.headYaw = t >= 12.4 ? 0.35 : 0; o.headPitch = t >= 12.4 ? 0.22 : -0.05;
  }
  if (t >= 13.95 && t < 14.45) { o.surprise = 1.2; o.mouth = 1.1; o.eyeDots = 0; o.browTilt = 0.35; o.blink = 0; o.headYaw = 0.3; } // "안 돼"
  if (t >= 14.45 && t < 14.6) { o.blink = 1; o.mouth = 0.2; }
  if (t >= 0.8 && t < 1.4) o.mouth = 0.15;
  return { lie, o };
}
function drawHero(t, S) {
  const { lie, o } = heroState(t);
  const { base, sit } = heroBase(lie);
  o.sit = sit;
  // arms down (hidden under duvet) except the pressing arm drawn separately
  o.armL = [0.15, 0]; o.armR = [0.15, 0];
  const Hd = drawCharacter(E, base, o);
  // long hair spreading over pillow / to floor
  if (S.hair > 0.01) {
    const L = S.hair;
    D(m.sphere, M4.chain(M4.T(HX - 0.1, 0.74 + (lie < 0.5 ? 0.5 : 0), -1.45 - 0.0), M4.S(1.0 + 0.4 * L, 0.18, 0.5 + 0.3 * L)), '#1d1d22', { spec: 0.5 });
    if (L > 1) D(m.box, M4.chain(M4.T(HX - 0.95, 0.4, -1.2), M4.RZ(0.15), M4.S(0.5, 0.85 * (L - 1), 0.4)), '#1d1d22', { spec: 0.5 });
  }
  if (S.beard > 0.01) {
    const b = S.beard;
    D(m.sphere, M4.chain(Hd, M4.T(0, -0.36, 0.2), M4.S(0.62 * b, 0.55 * b, 0.42 * b)), '#f4f4f0', { spec: 0.2 });
    D(m.sphere, M4.chain(Hd, M4.T(0, -0.24, 0.39), M4.S(0.26 * b, 0.07 * b, 0.07 * b)), '#f4f4f0', { spec: 0.2 });
    D(m.sphere, M4.chain(Hd, M4.T(0, -0.285 - (o.mouth || 0) * 0.02, 0.41), M4.S(0.11 + (o.mouth || 0) * 0.05, 0.035 + (o.mouth || 0) * 0.12, 0.05)), '#7a2230', { spec: 0.2 });
  }
  // duvet (covers body; slides down when sitting)
  const dz = lerp(0.85, 0.35, lie), dl = lerp(1.5, 2.35, lie);
  const dcol = S.dust > 0 ? [lerp(1, 0.78, S.dust), lerp(1, 0.76, S.dust), lerp(1, 0.72, S.dust)] : [1, 1, 1];
  D(m.box, M4.chain(M4.T(0, 0.8, dz), M4.S(2.42, 0.34, dl)), dcol, { tex: TX.duvet, tr: [2, 2], spec: 0.1 });
  D(m.sphere, M4.chain(M4.T(0, 0.95, dz), M4.S(2.3, 0.42, dl * 0.98)), dcol, { tex: TX.duvet, tr: [2, 2], spec: 0.1 });
  if (S.dust > 0.05) { const R = rng(77); for (let i = 0; i < 9; i++) D(m.disc, M4.chain(M4.T((R() - 0.5) * 1.6, 1.165, dz + (R() - 0.5) * 1.2), M4.RX(-Math.PI / 2), M4.S(0.35 + R() * 0.3, 0.2 + R() * 0.2, 1)), '#9d958a', { alpha: 0.45 * S.dust, spec: 0 }); }
  return { Hd, lie };
}
function drawMom(t, S) {
  // 0-0.8 faint silhouette (20%), 1.4-6 at door, ladle; 16.6+ white hair
  let a = 0, x = -1.9, z = -1.75, yaw = 0.45, armR = [0.5, 0.9], armL = [0.2, 0];
  if (t < 0.8) a = 0.2;
  else if (t < 1.4) { a = 0.2 * (1 - smooth(0.8, 1.2, t)); z = -1.75 - smooth(0.8, 1.3, t) * 0.4; }
  else if (t >= 3.4 && t < 4.4) { a = smooth(3.4, 3.6, t); armR = [0.5, 1.2 + 0.5 * Math.abs(Math.sin(t * 18))]; }
  else if (t >= 4.4 && t < 6.0) a = 1;
  else if (t >= 9.2 && t < 11.0) { a = smooth(9.3, 9.7, t); x = -1.9; z = -2.0; }
  else if (t >= 16.6 && t < 18.2) a = smooth(16.6, 16.85, t);
  if (a < 0.01) return;
  const grey = t >= 9.2;
  const sigh = t >= 16.6 ? Math.sin(clamp((t - 16.9) / 0.9, 0, 1) * Math.PI) : 0;
  withAlpha(a, () => {
    const base = M4.chain(M4.T(x, 0, z), M4.S(1.0));
    drawCharacter(E, base, { shirt: '#7a8cff', vest: '#ffd86b', hair: 'bob', hairColor: grey ? '#e9e9ef' : '#3b2a20', pants: '#3a3a44', bodyYaw: yaw, armR, armL, surprise: t >= 4.4 && t < 6 ? 0.8 : 0, mouth: t >= 4.4 && t < 6 ? 0.7 : (sigh > 0 ? 0.5 * sigh : 0.15), headPitch: sigh * 0.35, eyeDots: t >= 16.6 ? 0.5 : 0 });
    // ladle
    const drop = stuff(t).ladleDropped;
    const hand = M4.apply(M4.chain(base, M4.RY(yaw)), [0.42, 0.68, 0.4]);
    const lp = [lerp(hand[0], x + 0.6, drop), lerp(hand[1], 0.05, drop), lerp(hand[2], z + 0.7, drop)];
    if (t < 16.6) {
      D(m.cyl, M4.chain(M4.T(lp[0], lp[1] + 0.15 * (1 - drop), lp[2]), M4.RZ(drop * 1.5), M4.S(0.04, 0.5, 0.04)), '#cfd3da', { spec: 0.9 });
      D(m.hemi, M4.chain(M4.T(lp[0] - drop * 0.25, lp[1] - 0.12 * (1 - drop), lp[2]), M4.RX(Math.PI), M4.S(0.2)), '#cfd3da', { spec: 0.9 });
    }
  });
}

// ---------------- camera ----------------
// CLOSE = cold-open composition (0초·4.4초 같은 구도)
const CLOSE = { pos: [-0.85, 2.35, 4.5], look: [-0.14, 1.36, -0.3], fov: 38 };
const MED = { pos: [-0.6, 2.1, 5.2], look: [0.02, 1.62, -0.3], fov: 40 };
const WIDE = { pos: [-0.1, 3.15, 5.6], look: [-0.68, 1.3, -1.0], fov: 52 };
const SHOTS = [
  { t0: 0, snap: true, target: (t) => ({ pos: [CLOSE.pos[0] + 0.05 * t, CLOSE.pos[1], CLOSE.pos[2] - 0.08 * t], look: CLOSE.look, fov: CLOSE.fov }) },
  { t0: 0.8, w: 8, target: (t) => CLOSE },
  { t0: 1.4, snap: true, target: (t) => ({ pos: [CLOSE.pos[0], CLOSE.pos[1], CLOSE.pos[2] - 0.05 * (t - 1.4)], look: CLOSE.look, fov: CLOSE.fov }) },
  { t0: 3.4, w: 5, target: (t) => WIDE },
  { t0: 4.4, snap: true, target: (t) => ({ pos: [CLOSE.pos[0] + 0.03 * (t - 4.4), CLOSE.pos[1], CLOSE.pos[2] - 0.05 * (t - 4.4)], look: CLOSE.look, fov: CLOSE.fov }) },
  { t0: 6.0, w: 4, target: (t) => ({ pos: [WIDE.pos[0] - 0.08 * (t - 6), WIDE.pos[1] - 0.03 * (t - 6), WIDE.pos[2] - 0.12 * (t - 6)], look: WIDE.look, fov: WIDE.fov }) },
  { t0: 11.0, w: 6, target: (t) => MED },
  { t0: 12.9, w: 9, target: (t) => ({ pos: [-0.4, 2.1, 4.6], look: [0.08, 1.58, -0.2], fov: 38 }) },
  { t0: 13.95, w: 10, target: (t) => ({ pos: [-0.6, 2.2, 5.3], look: [0.02, 1.6, -0.3], fov: 40 }) },
  { t0: 16.6, w: 4, target: (t) => ({ pos: [0.0, 2.7, 4.6], look: [-1.0, 1.3, -1.2], fov: 50 }) },
];
function shakeAt(t) {
  let s = 0; for (const [a, amp] of [[0.8, 0.05], [3.45, 0.03], [3.7, 0.03], [3.95, 0.03], [4.4, 0.05], [9.2, 0.07], [11.0, 0.04], [14.1, 0.05], [14.6, 0.09]]) { const d = t - a; if (d >= 0 && d < 0.45) s = Math.max(s, amp * (1 - d / 0.45)); }
  if (t >= 9.2 && t < 10.9) s = Math.max(s, 0.02);
  return s ? [Math.sin(t * 71) * s, Math.cos(t * 53) * s, 0] : null;
}
function envAt(t) {
  const d = dayAt(t), k = lerp(0.55, 1.0, d);
  return { skyTop: [0.2, 0.22, 0.3], skyBot: [0.1, 0.1, 0.14], light: [0.5, 1.0, 0.75], fog: [0.95, 0.9, 0.85], amb: [0.95 * k, 0.93 * k, 0.9 * k], gnd: [0.55 * k, 0.48 * k, 0.42 * k], fogNear: 9, fogFar: 30 };
}

// ---------------- scene ----------------
let ZZ = [];
function scene(t) {
  const S = stuff(t);
  drawRoom(t, S);
  const H = drawHero(t, S);
  drawMom(t, S);
  const P = drawPhone(t);
  // pressing arm visible in phone scenes (closeups / press moments)
  const handOn = (t < 3.4) || (t >= 4.4 && t < 6.0) || (t >= 3.4 && t < 4.4) || (t >= 14.0 && t < 14.45);
  if (handOn) {
    const reach = t >= 14.0 ? [HX + 0.3, 1.42, 0.05] : null;
    const press = pressAmt(t);
    if (t < 14.0 || press > 0 || t < 14.3) drawHand(t, P, reach);
  }
  // snore bubbles 16.6+
  if (t >= 15.0 && t < 18.0) {
    for (let k = 0; k < 3; k++) { const u = ((t - 15.0) * 0.8 + k / 3) % 1; D(m.sphere, M4.chain(M4.T(HX + 0.2 + u * 0.5, 1.2 + u * 0.9, -1.0 + u * 0.1), M4.S(0.08 + u * 0.12)), '#dff3ff', { alpha: 0.8 * (1 - u), em: 0.5 }); }
  }
}

// ---------------- HUD ----------------
const SUBS = [
  [0.0, 1.95, '알람 5분만 더<br>눌렀거든.'],
  [2.15, 5.1, '근데 누를 때마다<br>자는 시간이 두 배야.'],
  [5.45, 6.97, '이틀이 두 달 되고,'],
  [9.25, 11.28, '결국 10년을 잤어.'],
  [11.5, 13.85, '겨우 깼는데<br>알람이 또 울려.'],
  // 14.15-15.9 "손이 먼저 눌렀어." — 같은 문구가 팝(14.1-16.4)으로 떠 있어 자막은 생략(중복 방지)
];
// [t0, t1, text, px, color]
const POPS = [
  [0.85, 1.38, '휘리릭', 36], [1.45, 2.12, '띠리리', 44], [2.2, 2.56, '딸깍', 44], [2.6, 2.97, '또 딸깍', 44, '#ffe14d'], [3.0, 3.38, '딸깍', 44],
  [3.45, 4.36, '쾅쾅', 48], [4.45, 5.95, '999+', 48, '#ff6b81'], [6.05, 7.5, '사르륵', 44], [7.65, 9.1, '쿨쿨', 44], [9.25, 10.9, '쿠구궁', 48],
  [11.05, 12.3, '번쩍', 48, '#ffe14d'], [12.95, 13.9, '띠리리', 44], [14.1, 16.45, '손이 먼저 눌렀어', 40, '#ffe14d'], [16.7, 17.9, '하아…', 44],
];
const ENDT = 18.0;
let popKey = '';
function hud(t) {
  const s = SUBS.find(([a, b]) => t >= a && t < b);
  $('sub').innerHTML = s ? s[2] : '';
  $('subRow').style.opacity = s && t < ENDT ? 1 : 0;
  // counter
  const C = $('counter'), v = counterAt(t);
  if (v === null || t >= ENDT) { $('counterRow').style.opacity = 0; }
  else {
    $('counterRow').style.opacity = 1;
    C.querySelector('.num').innerHTML = v.toLocaleString('en-US') + '<small>분</small>';
    fitText(C.querySelector('.num'), 48, 290, 30);
    C.querySelector('.sub').textContent = t < 0.8 ? '이틀째' : (t < 1.3 ? '되감는 중' : subFor(v));
    let lc = -9; for (let tt = t; tt > t - 0.3; tt -= 1 / 60) { const w = counterAt(tt); if (w !== v) { lc = tt; break; } }
    let sc = 1 + 0.16 * Math.exp(-(t - lc) * 12);
    if (t >= 14.6 && t < 15.2) sc = 1 + 0.22 * Math.exp(-(t - 14.6) * 7);
    if (t < 0.8) sc = 1.0 + 0.03 * Math.sin(t * 40);
    C.style.transform = `scale(${sc.toFixed(3)})`;
  }
  // pop (scale/translateY only on inner element)
  const P = $('pop'), p = POPS.find(([a, b]) => t >= a && t < b);
  if (p && t < ENDT) {
    const u = (t - p[0]) / (p[1] - p[0]); const sc = easeOutBack(Math.min(1, u * 4));
    const key = p[2] + p[3];
    if (key !== popKey) { P.textContent = p[2]; fitText(P, p[3], 300, 24); popKey = key; }
    P.style.color = p[4] || '#fff';
    P.style.transform = `translateY(${(-8 * Math.min(1, u * 3)).toFixed(1)}px) scale(${Math.max(0.01, sc).toFixed(3)})`;
    $('popRow').style.opacity = u > 0.85 ? (1 - (u - 0.85) / 0.15).toFixed(3) : 1;
  } else { $('popRow').style.opacity = 0; }
  // rewind overlay
  const rw = t >= 0.8 && t < 1.4;
  $('rew').style.opacity = rw ? 0.9 : 0;
  const cv = $('c');
  cv.style.filter = rw ? 'saturate(0.5) contrast(1.15) blur(1.2px)' : (t >= ENDT ? 'brightness(0.72) blur(2px)' : (t >= 14.2 && t < 14.6 ? 'saturate(1.4) contrast(1.1)' : 'none'));
  // flashes
  let fl = 0; for (const [ft, a] of [[0.8, 0.5], [1.38, 0.35], [6.0, 0.25], [9.2, 0.45], [11.0, 0.7], [14.6, 0.5]]) { const d = t - ft; if (d >= 0 && d < 0.3) fl = Math.max(fl, a * (1 - d / 0.3)); }
  $('flash').style.opacity = fl.toFixed(3);
  // end card
  const ec = smooth(ENDT, ENDT + 0.25, t);
  $('endRow').style.opacity = ec.toFixed(3);
  $('end').style.transform = `scale(${(0.85 + 0.15 * easeOutBack((t - ENDT) / 0.35)).toFixed(3)})`;
  $('titleRow').style.opacity = (1 - ec * 0.65).toFixed(3); $('badgeRow').style.opacity = (1 - ec * 0.65).toFixed(3);
}

window.DURATION = DURATION;
window.renderAt = function (t) {
  const cam = springCamera(SHOTS, t, shakeAt(t));
  E.begin(cam, envAt(t));
  scene(t);
  E.end();
  hud(t);
  return true;
};
window.renderAt(0);
</script>
