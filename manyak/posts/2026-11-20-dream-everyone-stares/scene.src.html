<div id="end"><div class="card"><div class="ep">만약에 EP03</div><div class="share">수업 시간마다 침 흘리며<br>자는 친구한테 보내기</div><div class="next">다음 만약에는 내일 저녁 7시</div></div></div>

</div>
<script src="../../engine/engine.js"></script>
<script>
'use strict';
const { M4, rng, clamp, lerp, smooth, easeOutBack, springCamera, drawCharacter, drawMini, basis } = ME;
const E = MiniEngine(document.getElementById('c'));
const m = E.meshes, D = E.draw;
const DURATION = 19.5;
const FONT = "'Noto Sans CJK KR','Noto Sans KR',sans-serif";
const SHIRTS = ['#4f8cff', '#ffc94d', '#2fbf71', '#b46cff', '#ff9f1c', '#20c4d4', '#e05d5d', '#7a8cff', '#9ccc65', '#ff7ab6'];
const HAIRS = ['#1d1d22', '#3b2a20', '#5a3b28', '#1d1d22', '#6b4a2f', '#2a2a33'];
function blinkAt(t, off) { const p = (t + off) % 3.1; return p < 0.12 ? Math.sin(p / 0.12 * Math.PI) : 0; }
function shadow(x, y, z, r, a) { D(m.disc, M4.chain(M4.T(x, y + 0.01, z), M4.RX(-Math.PI / 2), M4.S(r)), [0, 0, 0], { alpha: a === undefined ? 0.25 : a, spec: 0, em: 1 }); }
const yawTo = (from, to) => Math.atan2(to[0] - from[0], to[2] - from[2]);
const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const HERO = { shirt: '#ff6b81', hair: 'bob' };

// ---------------- textures ----------------
const TX = {
  earth: E.texture((c, w, h) => {
    c.fillStyle = '#3d8bff'; c.fillRect(0, 0, w, h);
    const R = rng(21);
    for (let i = 0; i < 26; i++) { c.fillStyle = i % 5 === 0 ? '#e9f1ff' : (i % 3 ? '#5fcf6a' : '#8ad16b'); c.beginPath(); c.ellipse(R() * w, h * 0.15 + R() * h * 0.7, 20 + R() * 60, 12 + R() * 30, R() * 3, 0, 7); c.fill(); }
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, 14); c.fillRect(0, h - 14, w, 14);
  }, 512, 256),
  winFace: E.texture((c, w, h) => {
    c.fillStyle = '#262a40'; c.fillRect(0, 0, w, h);
    const R = rng(8);
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const X = x * 64 + 8, Y = y * 64 + 8;
      c.fillStyle = R() < 0.15 ? '#3b4160' : '#ffd86b'; c.fillRect(X, Y, 48, 46);
      if (c.fillStyle !== '#3b4160') {
        c.fillStyle = '#f3cdb8'; c.beginPath(); c.arc(X + 24, Y + 30, 13, 0, 7); c.fill();
        c.fillStyle = '#1d1d22'; c.beginPath(); c.arc(X + 24, Y + 26, 13, Math.PI, 0); c.fill();
        c.beginPath(); c.arc(X + 19, Y + 32, 2.6, 0, 7); c.arc(X + 29, Y + 32, 2.6, 0, 7); c.fill();
      }
    }
  }, 256, 256, true),
  eye: E.texture((c, w, h) => {
    c.fillStyle = '#1b1d2e'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(w / 2, h / 2, w * 0.42, h * 0.36, 0, 0, 7); c.fill();
    c.fillStyle = '#3a2618'; c.beginPath(); c.arc(w / 2, h / 2, h * 0.27, 0, 7); c.fill();
    c.fillStyle = '#000'; c.beginPath(); c.arc(w / 2, h / 2, h * 0.14, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(w / 2 + 14, h / 2 - 14, 9, 0, 7); c.fill();
  }, 256, 128),
  board: E.texture((c, w, h) => {
    c.fillStyle = '#2f5b46'; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(40, 60); c.lineTo(200, 60); c.moveTo(40, 110); c.lineTo(300, 110); c.moveTo(40, 160); c.lineTo(160, 160);
    c.moveTo(330, 70); c.quadraticCurveTo(400, 20, 460, 90); c.moveTo(320, 170); c.lineTo(470, 170); c.stroke();
    c.font = `900 54px ${FONT}`; c.fillStyle = 'rgba(255,255,255,.85)'; c.fillText('x² + 2x', 330, 140);
  }, 512, 256),
  tunnel: E.texture((c, w, h) => {
    c.fillStyle = '#1d2236'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#ffe9a8'; for (let i = 0; i < 4; i++) c.fillRect(i * 64 + 10, h * 0.45, 26, 6);
  }, 256, 64, true),
  ad: E.texture((c, w, h) => {
    const cols = ['#ffd23f', '#5ec8ff', '#ff8fab', '#9be564'];
    for (let i = 0; i < 4; i++) { c.fillStyle = cols[i]; c.fillRect(i * w / 4, 0, w / 4 - 4, h); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(i * w / 4 + 10, 12, w / 4 - 30, 8); c.fillRect(i * w / 4 + 10, 28, w / 8, 6); }
  }, 512, 64, true),
};

// ---------------- data ----------------
const STARS = []; { const R = rng(5); for (let i = 0; i < 160; i++) { const a = R() * 6.28, b = (R() - 0.3) * 2.2, r = 70 + R() * 30; STARS.push([Math.cos(a) * Math.cos(b) * r, Math.sin(b) * r + 10, Math.sin(a) * Math.cos(b) * r, 0.2 + R() * 0.35]); } }
const EARTH_R = 5;
const EARTH_P = []; { const R = rng(17); for (let i = 0; i < 520; i++) { const th = 0.16 + Math.pow(R(), 0.8) * 1.25, ph = R() * 6.283; EARTH_P.push({ n: [Math.sin(th) * Math.sin(ph), Math.cos(th), Math.sin(th) * Math.cos(ph)], shirt: SHIRTS[i % 10], hair: HAIRS[i % 6], ra: (R() - 0.5) * 5, s: 0.26 + R() * 0.06 }); } }
const UFOS = [{ p: [-1.35, 7.35, 0.9], s: 1.0, ph: 0 }, { p: [1.45, 7.6, 0.6], s: 1.05, ph: 1.7 }, { p: [0.15, 8.6, -2.6], s: 1.3, ph: 3.1 }];
const CITY_B = []; { const R = rng(41); for (let i = 0; i < 46; i++) { const a = i / 46 * 6.283 + R() * 0.1, r = 13 + R() * 26; CITY_B.push({ x: Math.sin(a) * r, z: Math.cos(a) * r, w: 4 + R() * 4, d: 4 + R() * 4, h: 8 + R() * 26 }); } }
const CITY_P = []; { const R = rng(43); for (let i = 0; i < 210; i++) { const a = R() * 6.283, r = 1.6 + Math.sqrt(R()) * 9.5; CITY_P.push({ x: Math.sin(a) * r, z: Math.cos(a) * r, shirt: SHIRTS[i % 10], hair: HAIRS[i % 6], ra: (R() - 0.5) * 4 }); } }
const PLAT_P = []; { const R = rng(47); for (let ix = 0; ix < 7; ix++) for (let iz = 0; iz < 11; iz++) PLAT_P.push({ x: 2.3 + ix * 0.62 + (R() - 0.5) * 0.2, z: -3.2 + iz * 0.6 + (ix % 2) * 0.3, shirt: SHIRTS[(ix * 11 + iz) % 10], hair: HAIRS[(ix + iz) % 6], s: 1.45 + R() * 0.25, ra: (R() - 0.5) * 4 }); }

// ---------------- SPACE ----------------
function heroLookTarget() { return [0, 6.6, 3.5]; }
function drawSpace(st, look, t) {
  for (const s of STARS) D(m.sphere, M4.chain(M4.T(s[0], s[1], s[2]), M4.S(s[3])), '#ffffff', { em: 1, spec: 0 });
  D(m.sphere, M4.chain(M4.RY(st * 0.03), M4.S(EARTH_R * 2)), [1, 1, 1], { tex: TX.earth, spec: 0.5 });
  D(m.sphere, M4.S(EARTH_R * 2.08), '#9fd0ff', { alpha: 0.18, em: 0.6, spec: 0 });
  // crowd on the earth: look at hero (cheat toward camera side)
  const tgt = heroLookTarget();
  for (let i = 0; i < EARTH_P.length; i++) {
    const P = EARTH_P[i]; const pos = P.n.map(v => v * EARTH_R * 0.995);
    const d = [tgt[0] - pos[0], tgt[1] - pos[1], tgt[2] - pos[2]];
    const dn = d[0] * P.n[0] + d[1] * P.n[1] + d[2] * P.n[2];
    const tl = Math.hypot(d[0] - P.n[0] * dn, d[1] - P.n[1] * dn, d[2] - P.n[2] * dn);
    const pitch = Math.atan2(dn, tl);
    const k = look(i);
    drawMini(E, M4.mul(basis(pos, P.n, d, P.s), M4.RY((1 - k) * P.ra)), { shirt: P.shirt, hair: P.hair, pitch: clamp(pitch, 0, 1.0) * k });
  }
}
function ufoDrop(st) { return 6 * Math.pow(1 - smooth(9.3, 10.4, st), 1.5); }
function drawUfos(st, t, selfie) {
  UFOS.forEach((U, i) => {
    const y = U.p[1] + ufoDrop(st) * (1 + i * 0.3) + Math.sin(t * 2.2 + U.ph) * 0.06;
    const c = [U.p[0], y, U.p[2]];
    const tilt = Math.sin(t * 1.7 + U.ph) * 0.08;
    const B = M4.chain(M4.T(c[0], c[1], c[2]), M4.RZ(tilt), M4.S(U.s));
    D(m.sphere, M4.chain(B, M4.S(1.25, 0.28, 1.25)), '#c9d3e0', { spec: 1.0 });
    D(m.sphere, M4.chain(B, M4.T(0, -0.06, 0), M4.S(0.9, 0.22, 0.9)), '#7e8aa0', { spec: 0.8 });
    for (let k = 0; k < 8; k++) { const a = k / 8 * 6.283 + t * 3; D(m.sphere, M4.chain(B, M4.T(Math.sin(a) * 0.58, -0.02, Math.cos(a) * 0.58), M4.S(0.09)), k % 2 ? '#ffe14d' : '#ff6b81', { em: 1 }); }
    // alien inside dome, facing hero/camera
    const look = yawTo(c, [0, 6, 4]);
    const A = M4.chain(B, M4.T(0, 0.1, 0), M4.RY(look));
    D(m.sphere, M4.chain(A, M4.T(0, 0.12, 0), M4.S(0.3, 0.3, 0.26)), '#7be07b', { spec: 0.5 });
    const H = M4.chain(A, M4.T(0, 0.38, 0.04));
    D(m.sphere, M4.mul(H, M4.S(0.46, 0.4, 0.4)), '#8ef08a', { spec: 0.6 });
    for (const s of [-1, 1]) {
      D(m.sphere, M4.chain(H, M4.T(0.11 * s, 0.02, 0.16), M4.RZ(0.5 * s), M4.S(0.15, 0.1, 0.06)), '#101014', { spec: 1 });
      D(m.sphere, M4.chain(H, M4.T(0.11 * s + 0.03, 0.05, 0.19), M4.S(0.03)), '#ffffff', { em: 1 });
      D(m.cyl, M4.chain(H, M4.T(0.09 * s, 0.24, 0), M4.RZ(-0.3 * s), M4.S(0.02, 0.18, 0.02)), '#7be07b');
      D(m.sphere, M4.chain(H, M4.T(0.14 * s, 0.33, 0), M4.S(0.06)), '#ff6b81', { em: 0.5 });
    }
    if (i === 1 && selfie > 0) { // selfie arm toward hero, phone in front of hero's face
      const sh = M4.apply(M4.mul(A, M4.T(-0.2, 0.15, 0.08)), [0, 0, 0]);
      const goal = [0.62, 6.3, 0.95];
      const end = [lerp(sh[0], goal[0], selfie), lerp(sh[1], goal[1], selfie), lerp(sh[2], goal[2], selfie)];
      const dir = [end[0] - sh[0], end[1] - sh[1], end[2] - sh[2]]; const L = Math.hypot(...dir) + 0.001;
      const mid = [(sh[0] + end[0]) / 2, (sh[1] + end[1]) / 2, (sh[2] + end[2]) / 2];
      D(m.cyl, M4.mul(basis(mid, dir, [0, 0, 1]), M4.S(0.07, L, 0.07)), '#7be07b');
      D(m.sphere, M4.chain(M4.T(end[0], end[1], end[2]), M4.S(0.11)), '#8ef08a');
      const PH = M4.chain(M4.T(end[0] + 0.02, end[1] + 0.12, end[2]), M4.RY(-0.5));
      D(m.box, M4.mul(PH, M4.S(0.2, 0.36, 0.035)), '#ff6b81', { spec: 1 });
      D(m.box, M4.chain(PH, M4.T(0, 0, -0.02), M4.S(0.17, 0.32, 0.005)), '#9fe3ff', { em: 0.9 });
      D(m.sphere, M4.chain(PH, M4.T(0.05, 0.12, 0.022), M4.S(0.05, 0.05, 0.02)), '#111', { spec: 1 });
    }
    D(m.sphere, M4.chain(B, M4.T(0, 0.18, 0), M4.S(0.78, 0.72, 0.78)), '#bfe6ff', { alpha: 0.28, spec: 1 });
  });
}
function drawSpaceHero(st, t, cold) {
  const hp = [0, EARTH_R - 0.02, 0];
  const wave = Math.sin(t * 12);
  let o = { surprise: 1, mouth: cold ? 1.2 : 1.0, armL: [2.0 + wave * 0.2, 0.3], armR: [2.0 - wave * 0.2, 0.3], headPitch: -0.12 };
  if (st >= 11.0 && st < 12.0) { o = { surprise: 0.6, mouth: 0.7, browTilt: 0.2, armL: [0.5, 0.3], armR: [2.6, 0.2], headYaw: 0.35, headPitch: -0.1 }; }
  drawCharacter(E, M4.chain(M4.T(hp[0], hp[1], hp[2])), Object.assign({}, HERO, { bodyYaw: 0.12, blink: 0 }, o));
  shadow(0, EARTH_R - 0.02, 0, 0.6, 0.3);
}

// ---------------- SUBWAY ----------------
const SEATS = []; {
  const zs = [-1.1, -1.75, -2.4, -3.05, -4.2, -4.85, -5.5, -6.6, -7.25, -7.9];
  for (const side of [-1, 1]) zs.forEach((z, k) => SEATS.push({ x: side * 1.17, z, side, shirt: SHIRTS[(k * 3 + (side > 0 ? 1 : 0)) % 10], hair: k % 3 === 0 ? 'bob' : 'short', hc: HAIRS[(k + (side > 0 ? 2 : 0)) % 6] }));
}
// who turns when: grandma (left -1.1) first; then pairs
SEATS.forEach((s, i) => { s.turn = 3.8 + (i % 7) * 0.025; });
const GRANNY = SEATS[0]; GRANNY.turn = 1.8; GRANNY.granny = true;
SEATS[11].turn = 3.0; SEATS[2].turn = 3.0;                 // 2명 (hero looks left side)
SEATS[12].turn = 3.4; SEATS[13].turn = 3.4;                // 4명
SEATS[1].turn = 3.4;
const DOOR_Z = 0.15;
function drawSubway(t, moving) {
  const L0 = 3.6, L1 = -10;
  const cz = (L0 + L1) / 2, len = L0 - L1;
  D(m.box, M4.chain(M4.T(0, -0.05, cz), M4.S(2.9, 0.1, len)), '#9aa3ad', { spec: 0.3 });
  D(m.box, M4.chain(M4.T(0, 0.004, cz), M4.S(0.9, 0.01, len)), '#b8c0c9', { spec: 0.2 });
  D(m.box, M4.chain(M4.T(0, 2.45, cz), M4.S(2.9, 0.1, len)), '#f4f5f7', { em: 0.3 });
  for (const x of [-0.55, 0.55]) D(m.box, M4.chain(M4.T(x, 2.39, cz), M4.S(0.18, 0.03, len)), '#ffffff', { em: 1 });
  D(m.box, M4.chain(M4.T(0, 1.2, L1), M4.S(2.9, 2.5, 0.1)), '#dfe3e8');
  D(m.box, M4.chain(M4.T(0, 1.0, L1 + 0.06), M4.S(0.8, 1.9, 0.04)), '#b9c3cf', { spec: 0.8 });
  const scroll = moving ? t * 6 : 0;
  for (const side of [-1, 1]) {
    const x = side * 1.45;
    // lower wall, window band, upper wall
    D(m.box, M4.chain(M4.T(x, 0.45, cz), M4.S(0.08, 0.9, len)), '#e8ebef');
    D(m.box, M4.chain(M4.T(x, 2.15, cz), M4.S(0.08, 0.6, len)), '#e8ebef');
    D(m.box, M4.chain(M4.T(x - side * 0.05, 1.98, cz), M4.S(0.02, 0.18, len)), [1, 1, 1], { tex: TX.ad, tr: [len / 2, 1], em: 0.4 });
    // outside: tunnel (moving) or platform
    if (side < 0 || moving) D(m.box, M4.chain(M4.T(side * 1.9, 1.3, cz), M4.S(0.05, 1.2, len)), [1, 1, 1], { tex: TX.tunnel, tr: [len / 2 + 0.0001, 1], em: 0.9 });
    D(m.box, M4.chain(M4.T(x, 1.33, cz), M4.S(0.03, 0.86, len)), '#bfe6ff', { alpha: side > 0 && !moving ? 0.12 : 0.35, spec: 1 });
    // window pillars
    for (let z = L0 - 0.5; z > L1; z -= 1.6) if (!(side > 0 && Math.abs(z - DOOR_Z) < 1.0)) D(m.box, M4.chain(M4.T(x, 1.33, z), M4.S(0.1, 0.9, 0.18)), '#e8ebef');
    // bench
    D(m.box, M4.chain(M4.T(side * 1.2, 0.22, cz - 1.5), M4.S(0.5, 0.44, len - 3)), '#9aa3ad');
    D(m.box, M4.chain(M4.T(side * 1.17, 0.47, cz - 1.5), M4.S(0.5, 0.1, len - 3)), '#3f6fd1', { spec: 0.5 });
    D(m.box, M4.chain(M4.T(side * 1.4, 0.75, cz - 1.5), M4.S(0.08, 0.5, len - 3)), '#3f6fd1', { spec: 0.5 });
    // straps
    for (let z = 2.6; z > L1 + 0.5; z -= 0.55) {
      const sw = Math.sin(t * 2 + z) * 0.05 * (moving ? 1 : 0.3);
      const S0 = M4.chain(M4.T(side * 0.62, 2.3, z), M4.RX(sw));
      D(m.box, M4.chain(S0, M4.T(0, -0.13, 0), M4.S(0.03, 0.26, 0.03)), '#e6e6e6');
      D(m.cyl, M4.chain(S0, M4.T(0, -0.32, 0), M4.RX(Math.PI / 2), M4.S(0.16, 0.025, 0.16)), '#ffd23f');
    }
    D(m.cyl, M4.chain(M4.T(side * 0.62, 2.3, cz), M4.RX(Math.PI / 2), M4.S(0.04, len, 0.04)), '#c9ced6', { spec: 1 });
  }
  for (const z of [1.2, -3.6, -7.0]) for (const s of [-1, 1]) D(m.cyl, M4.chain(M4.T(s * 0.9, 1.2, z), M4.S(0.05, 2.4, 0.05)), '#ffd23f', { spec: 0.9 });
  // right side door
  const open = smooth(4.95, 5.35, t) * (moving ? 0 : 1);
  for (const s of [-1, 1]) D(m.box, M4.chain(M4.T(1.45, 1.05, DOOR_Z + s * (0.32 + open * 0.62)), M4.S(0.06, 2.1, 0.62)), '#cfd6de', { spec: 0.8 });
}
function drawPlatform(t) {
  D(m.box, M4.chain(M4.T(5.5, -0.05, 0), M4.S(8, 0.1, 14)), '#c7c2b8', { spec: 0.2 });
  D(m.box, M4.chain(M4.T(1.75, 0.0, 0), M4.S(0.3, 0.02, 14)), '#ffd23f', { em: 0.3 });
  D(m.box, M4.chain(M4.T(9.0, 1.5, 0), M4.S(0.2, 3, 14)), '#e9e1cf');
  D(m.box, M4.chain(M4.T(5.5, 3.0, 0), M4.S(8, 0.1, 14)), '#f2f2f2', { em: 0.4 });
  const tgt = [0, 1.45, 0.4];
  PLAT_P.forEach((P, i) => {
    const k = smooth(5.0 + (i % 9) * 0.02, 5.2 + (i % 9) * 0.02, t);
    const yaw = yawTo([P.x, 0, P.z], tgt) + (1 - k) * P.ra;
    const pitch = Math.atan2(tgt[1] - P.s * 0.85, Math.hypot(P.x - tgt[0], P.z - tgt[2]));
    drawMini(E, M4.chain(M4.T(P.x, 0, P.z), M4.RY(yaw), M4.S(P.s)), { shirt: P.shirt, hair: P.hair, pitch: pitch * k });
  });
}
function heroSubwayOpts(t) {
  // head turns: 3.0 left, 3.4 right, 3.8 whip, 4.8 to door (+x)
  let yaw = 0;
  if (t >= 2.95 && t < 3.35) yaw = 0.9 * smooth(2.95, 3.12, t);

const $ = (id) => document.getElementById(id);
// counter value keys [t, value]; between keys of a "ramp" interpolate geometrically
const CKEYS = [[0, 8e9], [0.82, 8e9], [1.58, 1], [3.0, 1], [3.0, 2], [3.4, 2], [3.4, 4], [3.8, 4], [3.8, 8], [4.05, 64], [5.0, 64], [5.0, 128], [5.3, 16384], [6.25, 16384], [6.25, 32768], [6.7, 16777216], [7.85, 16777216], [7.85, 33554432], [8.35, 8e9], [12.95, 8e9], [12.95, 31], [16.62, 31], [16.62, 62]];

(function () { const d = $('dream'); const R = rng(3); for (let i = 0; i < 46; i++) { const p = document.createElement('div'); p.className = 'puff'; const side = i % 4, u = R(); let x, y; const s = 70 + R() * 70; if (side === 0) { x = u * 540; y = -s * 0.55; } else if (side === 1) { x = u * 540; y = 960 - s * 0.45; } else if (side === 2) { x = -s * 0.55; y = u * 960; } else { x = 540 - s * 0.45; y = u * 960; } p.style.left = (x - s / 2) + 'px'; p.style.top = (y - s / 2 + s / 2) + 'px'; p.style.width = s + 'px'; p.style.height = s + 'px'; d.insertBefore(p, d.firstChild); } })();
